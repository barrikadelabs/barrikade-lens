name: scale
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions: {contents: read}
jobs:
  million-entity-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_DB: lens, POSTGRES_USER: lens, POSTGRES_PASSWORD: lens}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LENS_TEST_DATABASE_URL: postgres://lens:lens@127.0.0.1:5432/lens?sslmode=disable
      LENS_RUN_SCALE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - run: go test -run TestMillionEntityInventoryQueryUnderTwoSeconds -count=1 -timeout=20m ./internal/hub
