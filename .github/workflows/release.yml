name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      launcher_version:
        description: Existing native-package version whose launcher still needs publishing
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
      APPLE_CERTIFICATE_P12: '${{ secrets.APPLE_CERTIFICATE_P12 }}'
      APPLE_CERTIFICATE_PASSWORD: '${{ secrets.APPLE_CERTIFICATE_PASSWORD }}'
      APPLE_APPLICATION_IDENTITY: '${{ vars.APPLE_APPLICATION_IDENTITY }}'
      APPLE_INSTALLER_IDENTITY: '${{ vars.APPLE_INSTALLER_IDENTITY }}'
      APPLE_NOTARY_KEY_P8: '${{ secrets.APPLE_NOTARY_KEY_P8 }}'
      APPLE_NOTARY_KEY_ID: '${{ secrets.APPLE_NOTARY_KEY_ID }}'
      APPLE_NOTARY_ISSUER_ID: '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
      AZURE_CLIENT_ID: '${{ secrets.AZURE_CLIENT_ID }}'
      AZURE_TENANT_ID: '${{ secrets.AZURE_TENANT_ID }}'
      AZURE_SUBSCRIPTION_ID: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
      AZURE_ARTIFACT_SIGNING_ENDPOINT: '${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}'
      AZURE_ARTIFACT_SIGNING_ACCOUNT: '${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}'
      AZURE_ARTIFACT_SIGNING_PROFILE: '${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - uses: azure/setup-helm@v4
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Release tag must be SemVer prefixed with v" >&2; exit 1; }
          required=(
            NODE_AUTH_TOKEN
            APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_APPLICATION_IDENTITY APPLE_INSTALLER_IDENTITY
            APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_PROFILE
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing required release configuration: $name" >&2; exit 1; }
          done
      - name: Test release source
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
          npm ci --ignore-scripts
          npm test
          helm lint deploy/helm/lens-hub
          helm lint deploy/helm/lens-k8s

  goreleaser:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.44.0

      - name: Verify Syft
        run: syft version

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  linux-native:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Build native npm binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-linux-x64 ./cmd/barrikade-lens
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-linux-arm64 ./cmd/barrikade-lens
      - uses: actions/upload-artifact@v4
        with: {name: native-linux, path: dist/barrikade-lens-linux-*}

  macos-native:
    needs: goreleaser
    runs-on: macos-15
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      MACOS_APPLICATION_IDENTITY: '${{ vars.APPLE_APPLICATION_IDENTITY }}'
      MACOS_INSTALLER_IDENTITY: '${{ vars.APPLE_INSTALLER_IDENTITY }}'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.44.0
      - name: Import Apple signing certificate
        shell: bash
        env:
          CERTIFICATE_P12: '${{ secrets.APPLE_CERTIFICATE_P12 }}'
          CERTIFICATE_PASSWORD: '${{ secrets.APPLE_CERTIFICATE_PASSWORD }}'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/barrikade-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build and sign native binaries and universal package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-darwin-arm64 ./cmd/barrikade-lens
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-darwin-x64 ./cmd/barrikade-lens
          codesign --force --options runtime --timestamp --sign "$MACOS_APPLICATION_IDENTITY" dist/barrikade-lens-darwin-arm64
          codesign --force --options runtime --timestamp --sign "$MACOS_APPLICATION_IDENTITY" dist/barrikade-lens-darwin-x64
          packaging/macos/build-pkg.sh "$version" dist/barrikade-lens-darwin-arm64 dist/barrikade-lens-darwin-x64 dist/barrikade-lens-universal.pkg
          codesign --verify --strict --verbose=2 dist/barrikade-lens-darwin-arm64
          codesign --verify --strict --verbose=2 dist/barrikade-lens-darwin-x64
          pkgutil --check-signature dist/barrikade-lens-universal.pkg
      - name: Notarize and staple package
        shell: bash
        env:
          NOTARY_KEY_P8: '${{ secrets.APPLE_NOTARY_KEY_P8 }}'
          NOTARY_KEY_ID: '${{ secrets.APPLE_NOTARY_KEY_ID }}'
          NOTARY_ISSUER_ID: '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit dist/barrikade-lens-universal.pkg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/barrikade-lens-universal.pkg
          xcrun stapler validate dist/barrikade-lens-universal.pkg
          spctl --assess --type install --verbose=2 dist/barrikade-lens-universal.pkg
      - name: Generate package integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          syft scan file:dist/barrikade-lens-universal.pkg -o spdx-json=dist/barrikade-lens-universal.pkg.spdx.json
          shasum -a 256 \
            dist/barrikade-lens-darwin-arm64 \
            dist/barrikade-lens-darwin-x64 \
            dist/barrikade-lens-universal.pkg \
            dist/barrikade-lens-universal.pkg.spdx.json > dist/checksums-macos.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/barrikade-lens-darwin-arm64
            dist/barrikade-lens-darwin-x64
            dist/barrikade-lens-universal.pkg
      - name: Upload signed release assets
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*

  windows-native:
    needs: goreleaser
    runs-on: windows-2025
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.44.0
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = "windows"; $env:CGO_ENABLED = "0"; $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/barrikade-lens-win32-x64.exe ./cmd/barrikade-lens
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/barrikade-lens-win32-arm64.exe ./cmd/barrikade-lens
      - name: Authenticate to Azure Artifact Signing
        uses: azure/login@v3
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
      - name: Sign native binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: '${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}'
          signing-account-name: '${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}'
          certificate-profile-name: '${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}'
          files-folder: '${{ github.workspace }}\dist'
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build architecture-specific MSI packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./packaging/windows/build-msi.ps1 -Version $version -Architecture x64 -Binary "$pwd/dist/barrikade-lens-win32-x64.exe" -Output "$pwd/dist/barrikade-lens-win32-x64.msi"
          ./packaging/windows/build-msi.ps1 -Version $version -Architecture arm64 -Binary "$pwd/dist/barrikade-lens-win32-arm64.exe" -Output "$pwd/dist/barrikade-lens-win32-arm64.msi"
      - name: Sign MSI packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: '${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}'
          signing-account-name: '${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}'
          certificate-profile-name: '${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}'
          files-folder: '${{ github.workspace }}\dist'
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures and generate integrity metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem dist/* -Include *.exe,*.msi -File | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "$($_.Name) has invalid Authenticode status $($signature.Status)" }
          }
          syft scan "file:dist/barrikade-lens-win32-x64.msi" -o "spdx-json=dist/barrikade-lens-win32-x64.msi.spdx.json"
          syft scan "file:dist/barrikade-lens-win32-arm64.msi" -o "spdx-json=dist/barrikade-lens-win32-arm64.msi.spdx.json"
          Get-ChildItem dist -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii dist/checksums-windows.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/barrikade-lens-win32-x64.exe
            dist/barrikade-lens-win32-arm64.exe
            dist/barrikade-lens-win32-x64.msi
            dist/barrikade-lens-win32-arm64.msi
      - name: Upload signed release assets
        shell: pwsh
        run: |
          $files = (Get-ChildItem dist -File).FullName
          gh release upload $env:GITHUB_REF_NAME $files --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: dist/*

  containers:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: hub, dockerfile: Dockerfile, image: barrikade-lens-hub}
          - {name: kubernetes, dockerfile: Dockerfile.k8s, image: barrikade-lens-k8s}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: sigstore/cosign-installer@v3
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: '${{ matrix.dockerfile }}'
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/barrikadelabs/${{ matrix.image }}:${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
      - name: Sign image digest
        run: cosign sign --yes ghcr.io/barrikadelabs/${{ matrix.image }}@${{ steps.build.outputs.digest }}

  helm:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Package, publish, and attach charts
        shell: bash
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for chart in deploy/helm/lens-hub deploy/helm/lens-k8s; do
            sed -i "s/^version:.*/version: $version/; s/^appVersion:.*/appVersion: \"$version\"/" "$chart/Chart.yaml"
            sed -i "s/^  tag:.*/  tag: \"$version\"/" "$chart/values.yaml"
            helm lint "$chart"
            helm package "$chart" --destination dist
          done
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          for archive in dist/*.tgz; do
            helm push "$archive" oci://ghcr.io/barrikadelabs/charts
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          done

  npm:
    needs: [linux-native, macos-native, windows-native, containers, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24, registry-url: 'https://registry.npmjs.org'}
      - name: Install deterministic npm CLI
        run: npm install --global npm@11.18.0
      - name: Install, build, and test committed launcher source
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm ci --ignore-scripts
          npm run build -w barrikade-lens
          npm test -w barrikade-lens
      - uses: actions/download-artifact@v4
        with: {pattern: native-*, path: artifacts, merge-multiple: true}
      - name: Stage platform packages
        shell: bash
        run: |
          set -euo pipefail
          install -Dm755 artifacts/barrikade-lens-darwin-arm64 npm/darwin-arm64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-darwin-x64 npm/darwin-x64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-linux-arm64 npm/linux-arm64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-linux-x64 npm/linux-x64/bin/barrikade-lens
          install -Dm644 artifacts/barrikade-lens-win32-arm64.exe npm/win32-arm64/bin/barrikade-lens.exe
          install -Dm644 artifacts/barrikade-lens-win32-x64.exe npm/win32-x64/bin/barrikade-lens.exe
          for package in npm/darwin-arm64 npm/darwin-x64 npm/linux-arm64 npm/linux-x64 npm/win32-arm64 npm/win32-x64; do
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package/"
          done
          VERSION="${GITHUB_REF_NAME#v}" node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const roots = ['darwin-arm64','darwin-x64','linux-arm64','linux-x64','win32-arm64','win32-x64'];
          for (const root of roots) {
            const path = `npm/${root}/package.json`;
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = version;
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }
          const launcher = JSON.parse(fs.readFileSync('npm/launcher/package.json', 'utf8'));
          launcher.version = version;
          for (const name of Object.keys(launcher.optionalDependencies)) launcher.optionalDependencies[name] = version;
          fs.writeFileSync('npm/launcher/package.json', JSON.stringify(launcher, null, 2) + '\n');
          NODE
      - name: Publish native packages before launcher
        shell: bash
        env: {NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "Missing required release secret: NPM_TOKEN" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          [[ "$version" != *-* ]] || dist_tag=next

          publish_package() {
            local package_path="$1"
            local package_name
            package_name="$(node -p "require('./$package_path/package.json').name")"
            if npm view "$package_name@$version" version --silent >/dev/null 2>&1; then
              echo "$package_name@$version already exists; skipping"
              return
            fi
            npm publish "./$package_path" --access public --provenance --tag "$dist_tag"
          }

          for package in npm/darwin-arm64 npm/darwin-x64 npm/linux-arm64 npm/linux-x64 npm/win32-arm64 npm/win32-x64; do
            publish_package "$package"
          done
          publish_package npm/launcher

  npm-launcher-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24, registry-url: 'https://registry.npmjs.org'}
      - name: Install deterministic npm CLI
        run: npm install --global npm@11.18.0
      - name: Validate recovery request and native packages
        id: validate_recovery
        shell: bash
        env:
          VERSION: '${{ inputs.launcher_version }}'
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "launcher_version must be a valid SemVer value without a v prefix" >&2
            exit 1
          }
          npm --version
          if npm view "barrikade-lens@$VERSION" version --silent >/dev/null 2>&1; then
            echo "barrikade-lens@$VERSION already exists; nothing to recover"
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_exists=false" >> "$GITHUB_OUTPUT"
          for package in \
            @barrikade/lens-darwin-arm64 \
            @barrikade/lens-darwin-x64 \
            @barrikade/lens-linux-arm64 \
            @barrikade/lens-linux-x64 \
            @barrikade/lens-win32-arm64 \
            @barrikade/lens-win32-x64
          do
            published="$(npm view "$package@$VERSION" version --silent)" || {
              echo "Required native package $package@$VERSION is not published" >&2
              exit 1
            }
            test "$published" = "$VERSION" || {
              echo "Required native package $package@$VERSION returned unexpected version $published" >&2
              exit 1
            }
          done
      - name: Build launcher from committed dependencies
        if: steps.validate_recovery.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build -w barrikade-lens
          npm test -w barrikade-lens
      - name: Stage and publish launcher with trusted publishing
        if: steps.validate_recovery.outputs.already_exists != 'true'
        shell: bash
        env:
          VERSION: '${{ inputs.launcher_version }}'
        run: |
          set -euo pipefail
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const path = 'npm/launcher/package.json';
          const launcher = JSON.parse(fs.readFileSync(path, 'utf8'));
          launcher.version = process.env.VERSION;
          for (const name of Object.keys(launcher.optionalDependencies)) {
            launcher.optionalDependencies[name] = process.env.VERSION;
          }
          fs.writeFileSync(path, JSON.stringify(launcher, null, 2) + '\n');
          NODE
          dist_tag=latest
          [[ "$VERSION" != *-* ]] || dist_tag=next
          npm pack ./npm/launcher --dry-run
          npm publish ./npm/launcher --access public --provenance --tag "$dist_tag"
