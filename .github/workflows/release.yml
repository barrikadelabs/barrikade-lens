name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      launcher_version:
        description: Existing native-package version whose launcher still needs publishing
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - uses: azure/setup-helm@v4
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Release tag must be SemVer prefixed with v" >&2; exit 1; }
          test -n "$NODE_AUTH_TOKEN" || { echo "Missing required release secret: NPM_TOKEN" >&2; exit 1; }
      - name: Test release source
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
          npm ci --ignore-scripts
          npm test
          helm lint deploy/helm/lens-hub
          helm lint deploy/helm/lens-k8s

  goreleaser:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.44.0

      - name: Verify Syft
        run: syft version

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  linux-native:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Build native npm binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-linux-x64 ./cmd/barrikade-lens
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-linux-arm64 ./cmd/barrikade-lens
      - uses: actions/upload-artifact@v4
        with: {name: native-linux, path: dist/barrikade-lens-linux-*}

  macos-native:
    needs: goreleaser
    runs-on: macos-15
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Build MVP native binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-darwin-arm64 ./cmd/barrikade-lens
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/barrikade-lens-darwin-x64 ./cmd/barrikade-lens
          gh release upload "$GITHUB_REF_NAME" dist/barrikade-lens-darwin-arm64 dist/barrikade-lens-darwin-x64 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: |
            dist/barrikade-lens-darwin-arm64
            dist/barrikade-lens-darwin-x64

  windows-native:
    needs: goreleaser
    runs-on: windows-2025
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - name: Build MVP native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = "windows"; $env:CGO_ENABLED = "0"; $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/barrikade-lens-win32-x64.exe ./cmd/barrikade-lens
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/barrikade-lens-win32-arm64.exe ./cmd/barrikade-lens
          gh release upload $env:GITHUB_REF_NAME dist/barrikade-lens-win32-x64.exe dist/barrikade-lens-win32-arm64.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: |
            dist/barrikade-lens-win32-x64.exe
            dist/barrikade-lens-win32-arm64.exe

  containers:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: hub, dockerfile: Dockerfile, image: barrikade-lens-hub}
          - {name: kubernetes, dockerfile: Dockerfile.k8s, image: barrikade-lens-k8s}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: sigstore/cosign-installer@v3
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: '${{ matrix.dockerfile }}'
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/barrikadelabs/${{ matrix.image }}:${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
      - name: Sign image digest
        run: cosign sign --yes ghcr.io/barrikadelabs/${{ matrix.image }}@${{ steps.build.outputs.digest }}

  helm:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package, publish, and attach charts
        shell: bash
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for chart in deploy/helm/lens-hub deploy/helm/lens-k8s; do
            sed -i "s/^version:.*/version: $version/; s/^appVersion:.*/appVersion: \"$version\"/" "$chart/Chart.yaml"
            sed -i "s/^  tag:.*/  tag: \"$version\"/" "$chart/values.yaml"
            helm lint "$chart"
            helm package "$chart" --destination dist
          done
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          for archive in dist/*.tgz; do
            helm push "$archive" oci://ghcr.io/barrikadelabs/charts
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          done

  npm:
    needs: [linux-native, macos-native, windows-native, containers, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: {node-version: 24, registry-url: 'https://registry.npmjs.org'}
      - name: Install deterministic npm CLI
        run: npm install --global npm@11.18.0
      - name: Install, build, and test committed launcher source
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm ci --ignore-scripts
          npm run build -w barrikade-lens
          npm test -w barrikade-lens
      - uses: actions/download-artifact@v4
        with: {pattern: native-*, path: artifacts, merge-multiple: true}
      - name: Stage platform packages
        shell: bash
        run: |
          set -euo pipefail
          install -Dm755 artifacts/barrikade-lens-darwin-arm64 npm/darwin-arm64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-darwin-x64 npm/darwin-x64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-linux-arm64 npm/linux-arm64/bin/barrikade-lens
          install -Dm755 artifacts/barrikade-lens-linux-x64 npm/linux-x64/bin/barrikade-lens
          install -Dm644 artifacts/barrikade-lens-win32-arm64.exe npm/win32-arm64/bin/barrikade-lens.exe
          install -Dm644 artifacts/barrikade-lens-win32-x64.exe npm/win32-x64/bin/barrikade-lens.exe
          for package in npm/darwin-arm64 npm/darwin-x64 npm/linux-arm64 npm/linux-x64 npm/win32-arm64 npm/win32-x64; do
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package/"
          done
          VERSION="${GITHUB_REF_NAME#v}" node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const roots = ['darwin-arm64','darwin-x64','linux-arm64','linux-x64','win32-arm64','win32-x64'];
          for (const root of roots) {
            const path = `npm/${root}/package.json`;
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = version;
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }
          const launcher = JSON.parse(fs.readFileSync('npm/launcher/package.json', 'utf8'));
          launcher.version = version;
          for (const name of Object.keys(launcher.optionalDependencies)) launcher.optionalDependencies[name] = version;
          fs.writeFileSync('npm/launcher/package.json', JSON.stringify(launcher, null, 2) + '\n');
          NODE
      - name: Publish native packages before launcher
        shell: bash
        env: {NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "Missing required release secret: NPM_TOKEN" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          [[ "$version" != *-* ]] || dist_tag=next

          publish_package() {
            local package_path="$1"
            local package_name
            package_name="$(node -p "require('./$package_path/package.json').name")"
            if npm view "$package_name@$version" version --silent >/dev/null 2>&1; then
              echo "$package_name@$version already exists; skipping"
              return
            fi
            npm publish "./$package_path" --access public --provenance --tag "$dist_tag"
          }

          for package in npm/darwin-arm64 npm/darwin-x64 npm/linux-arm64 npm/linux-x64 npm/win32-arm64 npm/win32-x64; do
            publish_package "$package"
          done
          publish_package npm/launcher

  npm-launcher-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: {node-version: 24, registry-url: 'https://registry.npmjs.org'}
      - name: Install deterministic npm CLI
        run: npm install --global npm@11.18.0
      - name: Validate recovery request and native packages
        id: validate_recovery
        shell: bash
        env:
          VERSION: '${{ inputs.launcher_version }}'
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "launcher_version must be a valid SemVer value without a v prefix" >&2
            exit 1
          }
          npm --version
          if npm view "barrikade-lens@$VERSION" version --silent >/dev/null 2>&1; then
            echo "barrikade-lens@$VERSION already exists; nothing to recover"
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_exists=false" >> "$GITHUB_OUTPUT"
          for package in \
            @barrikade/lens-darwin-arm64 \
            @barrikade/lens-darwin-x64 \
            @barrikade/lens-linux-arm64 \
            @barrikade/lens-linux-x64 \
            @barrikade/lens-win32-arm64 \
            @barrikade/lens-win32-x64
          do
            published="$(npm view "$package@$VERSION" version --silent)" || {
              echo "Required native package $package@$VERSION is not published" >&2
              exit 1
            }
            test "$published" = "$VERSION" || {
              echo "Required native package $package@$VERSION returned unexpected version $published" >&2
              exit 1
            }
          done
      - name: Build launcher from committed dependencies
        if: steps.validate_recovery.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build -w barrikade-lens
          npm test -w barrikade-lens
      - name: Stage and publish launcher with trusted publishing
        if: steps.validate_recovery.outputs.already_exists != 'true'
        shell: bash
        env:
          VERSION: '${{ inputs.launcher_version }}'
        run: |
          set -euo pipefail
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const path = 'npm/launcher/package.json';
          const launcher = JSON.parse(fs.readFileSync(path, 'utf8'));
          launcher.version = process.env.VERSION;
          for (const name of Object.keys(launcher.optionalDependencies)) {
            launcher.optionalDependencies[name] = process.env.VERSION;
          }
          fs.writeFileSync(path, JSON.stringify(launcher, null, 2) + '\n');
          NODE
          dist_tag=latest
          [[ "$VERSION" != *-* ]] || dist_tag=next
          npm pack ./npm/launcher --dry-run
          npm publish ./npm/launcher --access public --provenance --tag "$dist_tag"
