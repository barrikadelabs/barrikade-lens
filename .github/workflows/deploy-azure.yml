name: deploy-azure

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-pilot
      url: ${{ steps.deploy.outputs.app-url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: rg-lens-pilot-ne
      AZURE_CONTAINER_APP: ca-lens-hub-pilot
      AZURE_CONTAINER_REGISTRY: acrlenspilotnef635
      IMAGE_REPOSITORY: lens-hub
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA: $sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short-sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: VERSION=pilot-${{ steps.source.outputs.short-sha }}
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=lens-hub-azure
          cache-to: type=gha,mode=max,scope=lens-hub-azure
          provenance: true
          sbom: true

      - name: Deploy Container Apps revision
        id: deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short-sha }}
        run: |
          set -euo pipefail
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_REPOSITORY:sha-$SOURCE_SHA"
          suffix="gh-${SHORT_SHA}-${GITHUB_RUN_ATTEMPT}"

          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$image" \
            --revision-suffix "$suffix" \
            --output none

          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          echo "app-url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Verify the new revision
        shell: bash
        env:
          SHORT_SHA: ${{ steps.source.outputs.short-sha }}
        run: |
          set -euo pipefail
          expected="gh-${SHORT_SHA}-${GITHUB_RUN_ATTEMPT}"

          for attempt in {1..30}; do
            read -r latest ready status < <(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --query '[properties.latestRevisionName,properties.latestReadyRevisionName,properties.runningStatus]' \
              --output tsv)
            if [[ "$latest" == *"--$expected" && "$ready" == "$latest" && "$status" == "Running" ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Revision did not become ready: latest=$latest ready=$ready status=$status" >&2
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${{ steps.deploy.outputs.app-url }}/healthz"

