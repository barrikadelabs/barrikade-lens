name: deploy-azure

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-pilot
      url: ${{ steps.deploy.outputs.app-url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: rg-lens-pilot-ne
      AZURE_CONTAINER_APP: ca-lens-hub-pilot
      AZURE_CONTAINER_REGISTRY: acrlenspilotnef635
      IMAGE_REPOSITORY: lens-hub
      LENS_PUBLIC_URL: https://lens.barrikade.ai
      LENS_CLERK_ISSUER: https://clerk.lens.barrikade.ai
      LENS_CLERK_PUBLISHABLE_KEY: ${{ vars.LENS_CLERK_PUBLISHABLE_KEY }}
      LENS_CLERK_AUTHORIZED_PARTY: https://lens.barrikade.ai
      LENS_POSTHOG_ENABLED: "true"
      LENS_POSTHOG_HOST: https://eu.i.posthog.com
      LENS_DEPLOYMENT_ENVIRONMENT: production
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA: $sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short-sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Verify production runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LENS_CLERK_PUBLISHABLE_KEY" == pk_live_* ]] || {
            echo "The azure-pilot environment must define a production LENS_CLERK_PUBLISHABLE_KEY variable." >&2
            exit 1
          }
          secret_names="$(az containerapp secret list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query '[].name' \
            --output tsv)"
          for required in \
            posthog-project-token \
            posthog-id-salt \
            lens-clerk-secret-key \
            lens-clerk-webhook-secret; do
            grep -Fxq "$required" <<<"$secret_names" || {
              echo "Required Container App secret is missing: $required" >&2
              exit 1
            }
          done

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: VERSION=pilot-${{ steps.source.outputs.short-sha }}
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=lens-hub-azure
          cache-to: type=gha,mode=max,scope=lens-hub-azure
          provenance: true
          sbom: true

      - name: Deploy Container Apps revision
        id: deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short-sha }}
        run: |
          set -euo pipefail
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_REPOSITORY:sha-$SOURCE_SHA"
          suffix="gh-${SHORT_SHA}-${GITHUB_RUN_ATTEMPT}"

          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$image" \
            --revision-suffix "$suffix" \
            --set-env-vars \
              "LENS_POSTHOG_ENABLED=$LENS_POSTHOG_ENABLED" \
              "LENS_POSTHOG_HOST=$LENS_POSTHOG_HOST" \
              "LENS_DEPLOYMENT_ENVIRONMENT=$LENS_DEPLOYMENT_ENVIRONMENT" \
              "LENS_PUBLIC_URL=$LENS_PUBLIC_URL" \
              "LENS_CLERK_ISSUER=$LENS_CLERK_ISSUER" \
              "LENS_CLERK_PUBLISHABLE_KEY=$LENS_CLERK_PUBLISHABLE_KEY" \
              "LENS_CLERK_AUTHORIZED_PARTY=$LENS_CLERK_AUTHORIZED_PARTY" \
              "LENS_POSTHOG_PROJECT_TOKEN=secretref:posthog-project-token" \
              "LENS_POSTHOG_ID_SALT=secretref:posthog-id-salt" \
            --output none

          custom_domain="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query "properties.configuration.ingress.customDomains[?name=='lens.barrikade.ai'].name | [0]" \
            --output tsv)"
          [[ "$custom_domain" == "lens.barrikade.ai" ]] || {
            echo "Custom domain is not bound to the Container App: lens.barrikade.ai" >&2
            exit 1
          }
          echo "app-url=$LENS_PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Verify the new revision
        shell: bash
        env:
          SHORT_SHA: ${{ steps.source.outputs.short-sha }}
        run: |
          set -euo pipefail
          expected="gh-${SHORT_SHA}-${GITHUB_RUN_ATTEMPT}"

          for attempt in {1..30}; do
            revision_state=()
            while IFS= read -r value; do
              revision_state+=("$value")
            done < <(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --query '[properties.latestRevisionName,properties.latestReadyRevisionName,properties.runningStatus]' \
              --output tsv)
            latest="${revision_state[0]:-}"
            ready="${revision_state[1]:-}"
            status="${revision_state[2]:-}"
            if [[ "$latest" == *"--$expected" && "$ready" == "$latest" && "$status" == "Running" ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Revision did not become ready: latest=$latest ready=$ready status=$status" >&2
              exit 1
            fi
            sleep 10
          done

          app_url="${{ steps.deploy.outputs.app-url }}"
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "$app_url/readyz"

          auth_config="$(curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "$app_url/v1/auth/config")"
          jq -e '
            .mode == "clerk" and
            .self_serve_enabled == true and
            .public_url == "https://lens.barrikade.ai" and
            (.clerk_publishable_key | startswith("pk_live_")) and
            .analytics.enabled == true and
            .analytics.host == "https://eu.i.posthog.com" and
            .analytics.deployment_environment == "production" and
            (.analytics.project_token | startswith("phc_"))
          ' <<<"$auth_config" >/dev/null
