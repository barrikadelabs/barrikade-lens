name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_DB: lens, POSTGRES_USER: lens, POSTGRES_PASSWORD: lens}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LENS_TEST_DATABASE_URL: postgres://lens:lens@127.0.0.1:5432/lens?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build and scan every shipped Go binary
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/barrikade-lens ./cmd/barrikade-lens
          go build -o /tmp/lens-hub ./cmd/lens-hub
          go build -o /tmp/lens-k8s ./cmd/lens-k8s
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary /tmp/barrikade-lens
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary /tmp/lens-hub
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary /tmp/lens-k8s
      - name: Endpoint scan performance gate
        run: go build -o /tmp/barrikade-lens ./cmd/barrikade-lens && timeout 30s /tmp/barrikade-lens scan --scope endpoint --format json --output /tmp/snapshot.json
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/barrikade-lens
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/lens-k8s
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck -w @barrikade/lens-hub-ui
      - run: npm test
      - run: npm run build
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.51.2 lint api/openapi.yaml
      - name: Run browser smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w @barrikade/lens-hub-ui
  privacy-platform:
    strategy: {fail-fast: false, matrix: {os: [macos-latest, windows-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: go test ./pkg/discovery ./internal/scanner/endpoint ./internal/tui ./internal/probe
  npm-native-smoke:
    strategy: {fail-fast: false, matrix: {os: [macos-latest, windows-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - name: Stage the runner's native package
        shell: bash
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform')"
          arch="$(node -p 'process.arch')"
          package="npm/$platform-$arch"
          suffix=""
          test "$platform" != win32 || suffix=".exe"
          mkdir -p "$package/bin" smoke/packages
          go build -o "$package/bin/barrikade-lens$suffix" ./cmd/barrikade-lens
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package/"
          npm pack "./$package" --pack-destination smoke/packages
          npm run build -w barrikade-lens
          npm pack ./npm/launcher --pack-destination smoke/packages
          cd smoke
          npm init -y >/dev/null
          npm install --ignore-scripts ./packages/*.tgz
          ./node_modules/.bin/barrikade-lens doctor
  macos-package-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build and install universal package without interaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o dist/lens-arm64 ./cmd/barrikade-lens
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o dist/lens-amd64 ./cmd/barrikade-lens
          packaging/macos/build-pkg.sh 0.0.0 dist/lens-arm64 dist/lens-amd64 dist/barrikade-lens.pkg
          sudo installer -pkg dist/barrikade-lens.pkg -target /
          test -x /usr/local/bin/barrikade-lens
          lipo -archs /usr/local/bin/barrikade-lens | grep -q arm64
          lipo -archs /usr/local/bin/barrikade-lens | grep -q x86_64
          test "$(stat -f '%Lp' '/Library/Application Support/Barrikade/Lens')" = 700
      - name: Preserve state on reinstall and normal uninstall
        shell: bash
        run: |
          set -euo pipefail
          state='/Library/Application Support/Barrikade/Lens'
          printf '%s\n' package-smoke | sudo tee "$state/identity.json" >/dev/null
          sudo chmod 600 "$state/identity.json"
          sudo installer -pkg dist/barrikade-lens.pkg -target /
          test "$(sudo cat "$state/identity.json")" = package-smoke
          cp /usr/local/share/barrikade-lens/full-cleanup.sh "$RUNNER_TEMP/full-cleanup.sh"
          sudo "$RUNNER_TEMP/full-cleanup.sh"
          test ! -e /usr/local/bin/barrikade-lens
          test "$(sudo cat "$state/identity.json")" = package-smoke
          sudo "$RUNNER_TEMP/full-cleanup.sh" --purge-state
          test ! -e "$state"
  windows-package-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build and install MSI without interaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -o dist/barrikade-lens.exe ./cmd/barrikade-lens
          ./packaging/windows/build-msi.ps1 -Version 0.0.0 -Architecture x64 -Binary "$pwd/dist/barrikade-lens.exe" -Output "$pwd/dist/barrikade-lens.msi"
          $msi = (Resolve-Path "$pwd/dist/barrikade-lens.msi").Path
          & msiexec.exe /i $msi /qn /norestart
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "silent MSI install failed with $LASTEXITCODE" }
          if (-not (Test-Path "$env:ProgramFiles\Barrikade Lens\barrikade-lens.exe")) { throw 'binary was not installed' }
          if (-not (Get-Service BarrikadeLens -ErrorAction SilentlyContinue)) { throw 'service was not registered' }
          $state = "$env:ProgramData\Barrikade\Lens"
          $acl = Get-Acl $state
          if (-not $acl.AreAccessRulesProtected) { throw 'state directory inherited an unprotected ACL' }
          $unexpected = $acl.Access | Where-Object { $_.IdentityReference -notmatch 'SYSTEM|Administrators' }
          if ($unexpected) { throw "state directory grants access to $($unexpected.IdentityReference -join ', ')" }
      - name: Preserve state on repair and normal uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = "$env:ProgramData\Barrikade\Lens"
          Set-Content -NoNewline -Encoding ascii -Path "$state\identity.json" -Value package-smoke
          Copy-Item "$env:ProgramFiles\Barrikade Lens\full-cleanup.ps1" "$env:RUNNER_TEMP\full-cleanup.ps1"
          $msi = (Resolve-Path "$pwd/dist/barrikade-lens.msi").Path
          & msiexec.exe /fa $msi /qn /norestart
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "silent MSI repair failed with $LASTEXITCODE" }
          if ((Get-Content -Raw "$state\identity.json") -ne 'package-smoke') { throw 'repair replaced machine identity' }
          & msiexec.exe /x $msi /qn /norestart
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "silent MSI uninstall failed with $LASTEXITCODE" }
          if (Test-Path "$env:ProgramFiles\Barrikade Lens\barrikade-lens.exe") { throw 'binary remained after uninstall' }
          if ((Get-Content -Raw "$state\identity.json") -ne 'package-smoke') { throw 'uninstall removed machine identity' }
          & "$env:RUNNER_TEMP\full-cleanup.ps1" -Confirm:$false
          if (Test-Path $state) { throw 'full cleanup preserved machine state' }
  linux-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.44.0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
      - name: Exercise noninteractive deb install, reinstall, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          package=$(find dist -name '*_linux_amd64.deb' -print -quit)
          test -n "$package"
          sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$package"
          test -x /usr/bin/barrikade-lens
          test -f /usr/lib/systemd/system/barrikade-lens.service
          test "$(stat -c '%a' /etc/barrikade-lens)" = 700
          test "$(stat -c '%a' /var/lib/barrikade-lens)" = 700
          printf '%s\n' package-smoke | sudo tee /etc/barrikade-lens/identity.json >/dev/null
          sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$package"
          test "$(sudo cat /etc/barrikade-lens/identity.json)" = package-smoke
          sudo env DEBIAN_FRONTEND=noninteractive dpkg -r barrikade-lens
          test "$(sudo cat /etc/barrikade-lens/identity.json)" = package-smoke
          sudo rm -rf /etc/barrikade-lens /var/lib/barrikade-lens /var/log/barrikade-lens
          test ! -e /etc/barrikade-lens
      - name: Exercise noninteractive rpm install
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -name '*_linux_amd64.rpm' -print -quit)"
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 bash -ec '
            dnf install -y /dist/*_linux_amd64.rpm
            test -x /usr/bin/barrikade-lens
            test -f /usr/lib/systemd/system/barrikade-lens.service
            test "$(stat -c %a /etc/barrikade-lens)" = 700
            test "$(stat -c %a /var/lib/barrikade-lens)" = 700
          '
  kubernetes-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.12.0
      - name: Lint and install discovery controller
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/lens-hub
          helm lint deploy/helm/lens-k8s
          kubectl create namespace lens-system
          kubectl -n lens-system create secret generic lens-k8s-collector --from-literal=config.json='{}'
          helm install discovery deploy/helm/lens-k8s --namespace lens-system --set persistence.enabled=false
          principal='system:serviceaccount:lens-system:discovery-lens-k8s'
          test "$(kubectl auth can-i get configmaps --all-namespaces --as="$principal")" = yes
          test "$(kubectl auth can-i get secrets --all-namespaces --as="$principal")" = no
          test "$(kubectl auth can-i create pods/exec --all-namespaces --as="$principal")" = no
