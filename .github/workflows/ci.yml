name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_DB: lens, POSTGRES_USER: lens, POSTGRES_PASSWORD: lens}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LENS_TEST_DATABASE_URL: postgres://lens:lens@127.0.0.1:5432/lens?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - run: go vet ./...
      - run: go test -race ./...
      - name: Endpoint scan performance gate
        run: go build -o /tmp/barrikade-lens ./cmd/barrikade-lens && timeout 30s /tmp/barrikade-lens scan --scope endpoint --format json --output /tmp/snapshot.json
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/barrikade-lens
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/lens-k8s
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  privacy-platform:
    strategy: {fail-fast: false, matrix: {os: [macos-latest, windows-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: go test ./pkg/discovery ./internal/scanner/endpoint ./internal/tui ./internal/probe
  npm-native-smoke:
    strategy: {fail-fast: false, matrix: {os: [macos-latest, windows-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - name: Stage the runner's native package
        shell: bash
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform')"
          arch="$(node -p 'process.arch')"
          package="npm/$platform-$arch"
          suffix=""
          test "$platform" != win32 || suffix=".exe"
          mkdir -p "$package/bin" smoke/packages
          go build -o "$package/bin/barrikade-lens$suffix" ./cmd/barrikade-lens
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package/"
          npm pack "./$package" --pack-destination smoke/packages
          npm run build -w barrikade-lens
          npm pack ./npm/launcher --pack-destination smoke/packages
          cd smoke
          npm init -y >/dev/null
          npm install --ignore-scripts ./packages/*.tgz
          ./node_modules/.bin/barrikade-lens doctor
  kubernetes-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.12.0
      - name: Lint and install discovery controller
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/lens-hub
          helm lint deploy/helm/lens-k8s
          kubectl create namespace lens-system
          kubectl -n lens-system create secret generic lens-k8s-collector --from-literal=config.json='{}'
          helm install discovery deploy/helm/lens-k8s --namespace lens-system --set persistence.enabled=false
          principal='system:serviceaccount:lens-system:discovery-lens-k8s'
          test "$(kubectl auth can-i get configmaps --all-namespaces --as="$principal")" = yes
          test "$(kubectl auth can-i get secrets --all-namespaces --as="$principal")" = no
          test "$(kubectl auth can-i create pods/exec --all-namespaces --as="$principal")" = no
