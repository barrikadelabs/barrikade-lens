openapi: 3.1.0
info:
  title: Barrikade Lens Hub API
  version: 2.0.0
  description: Open ingestion and query API for evidence-backed autonomous-agent discovery. Lens exposes inventory facts; it does not register, approve, protect, or govern agents.
servers: [{url: /}]
security: [{bearerAuth: []}]
paths:
  /healthz:
    get: {security: [], operationId: health, responses: {'200': {description: Healthy}}}
  /v1/auth/config:
    get: {security: [], operationId: authConfig, responses: {'200': {description: OIDC and quickstart access configuration}}}
  /v1/auth/exchange:
    post: {security: [], operationId: exchangeOIDCCode, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code, redirect_uri, code_verifier], properties: {code: {type: string}, redirect_uri: {type: string, format: uri}, code_verifier: {type: string, minLength: 43}}}}}}, responses: {'200': {description: Lens human session token}}}
  /v1/enrollment/exchange:
    post: {security: [], operationId: enrollCollector, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}, responses: {'200': {description: Source-scoped rotating collector credentials}}}
  /v1/collector/token:
    post: {security: [], operationId: rotateCollectorToken, requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [refresh_token], properties: {refresh_token: {type: string}}}}}}, responses: {'200': {description: Rotated access and refresh credentials}}}
  /v1/admin/enrollment-codes:
    post: {operationId: createEnrollmentCode, requestBody: {content: {application/json: {schema: {type: object, additionalProperties: false, properties: {expires_in_seconds: {type: integer, minimum: 60, maximum: 86400, default: 600}, uses: {type: integer, minimum: 1, maximum: 10000, default: 1}, source_type: {enum: [endpoint, repository, kubernetes], default: endpoint}}}}}}, responses: {'201': {description: Expiring use-limited enrollment code}}}
  /v1/admin/sources/{id}:
    delete: {operationId: revokeDiscoverySource, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Source credentials revoked and its current observations removed}, '404': {description: Source not found}}}
  /v1/admin/coverage/baselines:
    put:
      operationId: setCoverageBaselines
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoverageBaselineRequest'}}}}
      responses: {'200': {description: Manual expected-population baselines updated}, '403': {description: Administrator access required}}
  /v1/discovery/snapshots:
    post:
      operationId: submitDiscoverySnapshot
      requestBody: {required: true, content: {application/json: {schema: {$ref: './schema/discovery-snapshot-v1.json'}}}}
      responses: {'202': {description: Snapshot accepted into the PostgreSQL ingestion queue}, '422': {description: Snapshot failed schema or privacy validation}, '426': {description: Collector must upgrade to DiscoverySnapshot 1.1 or 1.2}}
  /v1/discovery/jobs/{id}:
    get:
      operationId: getDiscoveryJob
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Ingestion job status}, '404': {description: Job not found in the caller organization/source}}
  /v1/entities:
    get:
      operationId: listEntities
      parameters: [{name: kind, in: query, schema: {type: string}}, {name: confidence, in: query, schema: {enum: [confirmed, likely, possible]}}, {name: state, in: query, schema: {type: string}}, {name: surface, in: query, schema: {type: string}}, {name: target_id, in: query, schema: {type: string}}, {name: system_role, in: query, schema: {type: string}}, {name: system_type, in: query, schema: {type: string}}, {name: network_scope, in: query, schema: {type: string}}, {name: search, in: query, schema: {type: string}}, {name: sort, in: query, schema: {enum: [last_seen, name]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Current evidence-backed entity inventory}}
  /v1/entities/{id}:
    get: {operationId: getEntity, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Entity and retained evidence}, '404': {description: Entity not found}}}
  /v1/relationships:
    get: {operationId: listRelationships, parameters: [{name: kind, in: query, schema: {type: string}}, {name: entity_id, in: query, schema: {type: string}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Current discovery graph edges}}}
  /v1/changes:
    get: {operationId: listChanges, parameters: [{name: category, in: query, schema: {enum: [state, network_scope, attribution, capability, confidence, identity, freshness, metadata, declaration]}}, {name: target_id, in: query, schema: {type: string}}, {name: system_type, in: query, schema: {type: string}}, {name: system_role, in: query, schema: {enum: [system, supporting, component, artifact, target]}}, {name: surface, in: query, schema: {type: string}}, {name: window, in: query, schema: {enum: [24h, 7d, 30d, 90d]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Material discovery changes with safe field-level differences}}}
  /v1/overview:
    get: {operationId: getDiscoveryOverview, parameters: [{name: window, in: query, schema: {enum: [24h, 7d, 30d, 90d], default: 7d}}], responses: {'200': {description: Server-computed discovery posture, coverage, factual attention, data quality, and changes}}}
  /v1/systems:
    get: {operationId: listSystems, parameters: [{name: system_type, in: query, schema: {enum: [autonomous_agent, agent_tool, model_runtime]}}, {name: state, in: query, schema: {type: string}}, {name: surface, in: query, schema: {type: string}}, {name: target_id, in: query, schema: {type: string}}, {name: confidence, in: query, schema: {enum: [confirmed, likely, possible]}}, {name: attribution, in: query, schema: {enum: [attributed, unattributed]}}, {name: network_scope, in: query, schema: {type: string}}, {name: declaration_status, in: query, schema: {enum: [matched, unmatched, conflict]}}, {name: search, in: query, schema: {type: string}}, {name: sort, in: query, schema: {enum: [last_seen, name]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Root autonomous agents, agent tools, and model runtimes with declaration alignment}}}
  /v1/systems/{id}:
    get: {operationId: getSystem, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Root system posture, connected inventory, and evidence}, '404': {description: System not found}}}
  /v1/targets:
    get: {operationId: listTargets, parameters: [{name: target_type, in: query, schema: {enum: [endpoint, repository, kubernetes, catalog]}}, {name: include_catalog, in: query, description: Set false when rendering fleet coverage separately from declaration sources, schema: {type: boolean, default: true}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Unique discovery targets with nested active collectors}}}
  /v1/targets/{id}:
    get: {operationId: getTarget, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Discovery target, freshness, scan coverage, and collectors}, '404': {description: Target not found}}}
  /v1/coverage:
    get: {operationId: getCoverage, responses: {'200': {description: Source coverage and freshness}}}
  /v1/exports:
    get: {operationId: exportInventory, parameters: [{name: format, in: query, schema: {enum: [lens, ndjson, cyclonedx]}}], responses: {'200': {description: Lens JSON, JSONL, or CycloneDX 1.7 export}}}
  /v1/declarations:
    get:
      operationId: listResourceDeclarations
      parameters: [{name: status, in: query, schema: {enum: [matched, declared_only, conflict]}}, {name: publisher, in: query, schema: {type: string}}, {name: media_type, in: query, schema: {type: string}}, {name: mapped_kind, in: query, schema: {type: string}}, {name: source_id, in: query, schema: {type: string}}, {name: freshness, in: query, schema: {enum: [fresh, stale]}}, {name: trust_alignment, in: query, schema: {enum: [absent, aligned, misaligned, unresolved]}}, {name: signature_status, in: query, schema: {enum: [absent, present_unverified, malformed, unsupported]}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Current publisher declarations and observed-resource alignment}}
  /v1/declarations/{id}:
    get: {operationId: getResourceDeclaration, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Declaration metadata, evidence, matches, and safe change history}, '404': {description: Declaration not found}}}
  /v1/declaration-alignment:
    get: {operationId: getDeclarationAlignment, parameters: [{name: window, in: query, schema: {enum: [24h, 7d, 30d, 90d], default: 7d}}], responses: {'200': {description: Matched, declared-only, observed-only, conflict, stale-source, and unverified-claim aggregates}}}
  /v1/admin/discovery/catalogs/validate:
    post:
      operationId: validateResourceDeclarationCatalog
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCatalogCreate'}}}}
      responses: {'200': {description: Safe catalog preview without persistence}, '422': {description: Catalog could not be safely fetched or validated}}
  /v1/admin/discovery/catalogs:
    get: {operationId: listResourceDeclarationCatalogs, responses: {'200': {description: Configured ARD catalog sources}, '403': {description: Administrator access required}}}
    post:
      operationId: createResourceDeclarationCatalog
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCatalogCreate'}}}}
      responses: {'201': {description: Catalog source configured and initial refresh scheduled}, '409': {description: Catalog URL already configured}}
  /v1/admin/discovery/catalogs/{id}:
    put: {operationId: updateResourceDeclarationCatalog, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCatalogRequest'}}}}, responses: {'200': {description: Catalog source updated}}}
    delete: {operationId: deleteResourceDeclarationCatalog, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Source observations removed and history retained}}}
  /v1/admin/discovery/catalogs/{id}/refresh:
    post: {operationId: refreshResourceDeclarationCatalog, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {description: Immediate refresh scheduled through the PostgreSQL worker queue}}}
  /v1/exports/ard:
    post:
      operationId: exportARDManifest
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ARDExportRequest'}}}}
      responses:
        '200':
          description: Stateless ai-catalog.json document
          content: {application/ai-catalog+json: {schema: {$ref: './schema/ard-ai-catalog-v1.json'}}}
        '422': {description: A selected entry lacks a valid identifier, media type, or credential-free HTTPS artifact URL}
  /v1/webhooks:
    post: {operationId: createWebhook, requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [url], properties: {url: {type: string, format: uri, pattern: '^https://'}}}}}}, responses: {'201': {description: Webhook and one-time HMAC signing secret}}}
  /v1/connectors/github/webhook:
    post: {security: [], operationId: receiveGitHubWebhook, responses: {'202': {description: Signed webhook accepted}, '401': {description: Invalid signature}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque seek-pagination cursor returned by the previous page}
  schemas:
    Enrollment:
      type: object
      additionalProperties: false
      required: [code, hostname, platform, architecture, collector_version, identity_public_key, identity_proof]
      properties: {code: {type: string}, hostname: {type: string}, platform: {type: string}, architecture: {type: string}, collector_version: {type: string}, identity_public_key: {type: string, description: Base64url-encoded Ed25519 public key}, identity_proof: {type: string, description: Ed25519 signature over the enrollment request}}
    CoverageBaselineRequest:
      type: object
      additionalProperties: false
      required: [baselines]
      properties:
        baselines:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [target_type, expected_count]
            properties:
              target_type: {enum: [endpoint, repository, kubernetes]}
              expected_count: {type: [integer, 'null'], minimum: 0}
    ResourceCatalogRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 500}
        format: {const: ard, default: ard}
        url: {type: string, format: uri, pattern: '^https://'}
        refresh_interval_seconds: {type: integer, minimum: 3600, maximum: 86400, default: 21600}
        nested_policy: {enum: [same_site, disabled], default: same_site}
        enabled: {type: boolean}
    ResourceCatalogCreate:
      allOf:
        - {$ref: '#/components/schemas/ResourceCatalogRequest'}
        - {type: object, required: [url]}
    ARDExportRequest:
      type: object
      additionalProperties: false
      required: [publisher_domain, host_display_name, entries]
      properties:
        publisher_domain: {type: string}
        host_display_name: {type: string}
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [entity_id]
            properties:
              entity_id: {type: string}
              identifier: {type: string, pattern: '^urn:air:'}
              media_type: {type: string}
              artifact_url: {type: string, format: uri, pattern: '^https://'}
