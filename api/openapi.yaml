openapi: 3.1.0
info:
  title: Barrikade Lens Hub API
  version: 2.0.0
  description: Open ingestion and query API for evidence-backed autonomous-agent discovery and explainable exposure assessment. Lens does not verify effective authorization, invoke tools, change credentials, remediate, or enforce policy.
servers: [{url: /}]
security: [{bearerAuth: []}]
paths:
  /healthz:
    get: {security: [], operationId: health, responses: {'200': {description: Healthy}}}
  /livez:
    get: {security: [], operationId: liveness, responses: {'200': {description: Process is live}}}
  /readyz:
    get: {security: [], operationId: readiness, responses: {'200': {description: Process and database are ready}, '503': {description: Database is unavailable}}}
  /v1/auth/config:
    get: {security: [], operationId: authConfig, responses: {'200': {description: OIDC and quickstart access configuration}}}
  /v1/auth/exchange:
    post: {security: [], operationId: exchangeOIDCCode, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code, redirect_uri, code_verifier], properties: {code: {type: string}, redirect_uri: {type: string, format: uri}, code_verifier: {type: string, minLength: 43}}}}}}, responses: {'200': {description: Lens human session token}}}
  /v1/auth/clerk/webhook:
    post: {security: [], operationId: receiveClerkWebhook, description: Signed and idempotent asynchronous membership and account cleanup., responses: {'202': {description: Clerk lifecycle event accepted}, '401': {description: Invalid Svix signature}}}
  /v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Active user, workspace, role, permissions, and analytics preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {description: 'Session expired, revoked, banned, or has no active organization'}
  /v1/session/analytics:
    patch:
      operationId: updateSessionAnalytics
      description: Updates the authenticated managed account's prospective analytics preference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Analytics preference updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '404': {description: Analytics preferences are unavailable in this deployment}
  /v1/account:
    delete: {operationId: deleteAccount, description: Deletes the current Clerk identity through the Lens backend after enforcing sole-owner rules., responses: {'204': {description: Identity deleted}, '409': {description: Sole owner must transfer ownership or delete the workspace first}, '503': {description: Clerk identity deletion is temporarily unavailable}}}
  /v1/workspaces/bootstrap:
    post: {operationId: bootstrapWorkspace, description: Idempotently provisions the active Clerk organization without depending on webhook delivery., responses: {'200': {description: Existing workspace activated}, '201': {description: First workspace provisioned}}}
  /v1/workspaces/current:
    delete:
      operationId: deleteWorkspace
      description: Owner-only immediate workspace data purge.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [confirmation], properties: {confirmation: {type: string}}}}}}
      responses: {'204': {description: Workspace permanently deleted}, '403': {description: Owner role required}}
  /v1/enrollment/exchange:
    post: {security: [], operationId: enrollCollector, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}, responses: {'200': {description: Source-scoped short-lived access token and revocable installation credential}}}
  /v1/collector/token:
    post: {security: [], operationId: rotateCollectorToken, requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [refresh_token], properties: {refresh_token: {type: string, description: Stable installation credential retained until explicit source revocation}}}}}}, responses: {'200': {description: New short-lived access token plus the unchanged installation credential and canonical Hub URL}}}
  /v1/collector/quick-scan/failed:
    post: {operationId: reportQuickScanFailure, description: Records an allowlisted lifecycle failure category without discovery data., requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [failure], properties: {failure: {enum: [discovery, upload, interrupted]}}}}}}, responses: {'204': {description: Failure lifecycle event recorded}, '409': {description: Credential does not belong to an active Quick Scan}}}
  /v1/admin/enrollment-codes:
    post: {operationId: createEnrollmentCode, requestBody: {content: {application/json: {schema: {type: object, additionalProperties: false, properties: {expires_in_seconds: {type: integer, minimum: 60, maximum: 86400, default: 600}, uses: {type: integer, minimum: 1, maximum: 10000, default: 1}, source_type: {enum: [endpoint, repository, kubernetes], default: endpoint}}}}}}, responses: {'201': {description: Expiring use-limited enrollment code with the configured public Hub URL and exact collector version}}}
  /v1/deployment-policies:
    get:
      operationId: listDeploymentPolicies
      description: Lists organization-owned deployment policies with safe enrollment counts. Requires owner or administrator access.
      responses:
        '200':
          description: Deployment policies in the active workspace
          content: {application/json: {schema: {type: object, required: [policies], properties: {policies: {type: array, items: {$ref: '#/components/schemas/DeploymentPolicy'}}}}}}
        '403': {description: Administrator access required}
    post:
      operationId: createDeploymentPolicy
      description: Creates a durable policy; issue its display-once bootstrap credential separately.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPolicyRequest'}}}}
      responses:
        '201': {description: Deployment policy created, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPolicy'}}}}
        '403': {description: Administrator access required}
  /v1/deployment-policies/{id}:
    get:
      operationId: getDeploymentPolicy
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Policy and safe credential history without bootstrap values, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPolicy'}}}}
        '404': {description: Policy not found in the active workspace}
    patch:
      operationId: updateDeploymentPolicy
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPolicyUpdate'}}}}
      responses:
        '200': {description: Deployment policy updated, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPolicy'}}}}
        '409': {description: Revoked policies cannot be updated}
    delete:
      operationId: revokeDeploymentPolicy
      description: Revokes the policy and its bootstrap credentials without revoking enrolled devices.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Policy and active bootstrap credentials revoked}, '404': {description: Active policy not found}}
  /v1/deployment-policies/{id}/enrollment-credentials:
    post:
      operationId: rotateDeploymentPolicyCredential
      description: Revokes existing policy bootstrap credentials and returns a new display-once value. Only its hash is retained.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in_seconds: {type: integer, minimum: 60, maximum: 2592000}
                max_enrollments: {type: integer, minimum: 1, maximum: 100000}
      responses:
        '201': {description: Display-once policy bootstrap credential, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentCredentialCreation'}}}}
        '409': {description: Revoked policies cannot issue credentials}
  /v1/deployment-policies/{id}/enrollment-credentials/{credentialId}:
    delete:
      operationId: revokeDeploymentPolicyCredential
      description: Prevents future bootstrap exchanges without revoking devices already enrolled by the policy.
      parameters: [{$ref: '#/components/parameters/ID'}, {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Enrollment credential revoked}, '404': {description: Active credential not found in the policy}}
  /v1/deployment-policies/{id}/devices:
    get:
      operationId: listDeploymentPolicyDevices
      description: Lists the paginated device membership and lifecycle summary for an endpoint deployment policy. Requires owner or administrator access.
      parameters: [{$ref: '#/components/parameters/ID'}, {name: status, in: query, schema: {enum: [reporting, stale_offline, never_scanned, partial, failed, revoked]}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Policy-scoped device fleet, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceFleetPage'}}}}
        '403': {description: Administrator access required}
        '404': {description: Policy not found in the active workspace}
  /v1/device-fleet:
    get:
      operationId: listDeviceFleet
      description: Lists endpoint installations with safe lifecycle, collector, policy, and identity-quality metadata. Results are cursor paginated and retained revoked devices remain distinguishable from offline devices.
      parameters: [{name: policy_id, in: query, schema: {type: string, format: uuid}}, {name: status, in: query, schema: {enum: [reporting, stale_offline, never_scanned, partial, failed, revoked]}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Paginated device fleet, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceFleetPage'}}}}
        '403': {description: Inventory read permission required}
  /v1/device-fleet/{id}:
    get:
      operationId: getFleetDevice
      description: Inspects one endpoint installation without exposing protected identity material.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Device lifecycle detail, content: {application/json: {schema: {$ref: '#/components/schemas/FleetDevice'}}}}
        '403': {description: Inventory read permission required}
        '404': {description: Device not found in the active workspace}
    patch:
      operationId: renameFleetDevice
      description: Sets administrator-defined display metadata without changing observed hostname or installation identity.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 128}}}}}}
      responses: {'200': {description: Device renamed}, '403': {description: Administrator access required}, '404': {description: Device not found}}
    delete:
      operationId: revokeFleetDevice
      description: Revokes an individual installation and all active collector credentials while retaining its stale evidence and policy lineage.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Device revoked}, '403': {description: Administrator access required}, '404': {description: Active device not found}}
  /v1/admin/sources/{id}:
    delete: {operationId: revokeDiscoverySource, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Source credentials revoked and its current observations removed}, '404': {description: Source not found}}}
  /v1/admin/coverage/baselines:
    put:
      operationId: setCoverageBaselines
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoverageBaselineRequest'}}}}
      responses: {'200': {description: Manual expected-population baselines updated}, '403': {description: Administrator access required}}
  /v1/discovery/snapshots:
    post:
      operationId: submitDiscoverySnapshot
      requestBody: {required: true, content: {application/json: {schema: {$ref: './schema/discovery-snapshot-v1.json'}}}}
      responses: {'202': {description: Snapshot accepted into the PostgreSQL ingestion queue}, '429': {description: Source queue or request rate limit is active}, '422': {description: Snapshot failed schema or privacy validation}, '426': {description: Collector must use supported Discovery Snapshot version 1.1 or 1.2}}
  /v1/discovery/jobs/{id}:
    get:
      operationId: getDiscoveryJob
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Ingestion job status}, '404': {description: Job not found in the caller organization/source}}
  /v1/environments:
    get: {operationId: listEnvironments, responses: {'200': {description: Environments in the active workspace}}}
  /v1/environments/setup-sessions:
    post:
      operationId: createEnvironmentSetupSession
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentSetupRequest'}}}}
      responses: {'201': {description: Short-lived single-use setup with least-privilege instructions}, '403': {description: Environment management permission required}, '429': {description: Workspace setup rate limit is active}}
  /v1/environments/{id}:
    get: {operationId: getEnvironment, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Environment connection state and safe setup metadata}, '404': {description: Environment not found}}}
    patch:
      operationId: updateEnvironment
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {display_name: {type: string, maxLength: 128}, daily_schedule_enabled: {type: boolean}}}}}}
      responses: {'200': {description: Display name or daily schedule updated}}
    delete: {operationId: disconnectEnvironment, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Access revoked immediately and historical findings scheduled for purge after 90 days}}}
  /v1/environments/{id}/verify:
    post: {operationId: verifyEnvironment, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Access verified and first scan queued}, '202': {description: Collector enrollment awaited}, '401': {description: Provider rejected the temporary Lens identity}, '410': {description: Setup session expired or was cancelled}}}
  /v1/environments/{id}/activation:
    get: {operationId: getEnvironmentActivation, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Durable endpoint activation state and safe first-result status}, '404': {description: Environment not found}}}
  /v1/environments/{id}/github-status:
    get: {operationId: getGitHubEnvironmentStatus, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: 'Tenant-scoped GitHub authorization, repository progress, partial-result, and recovery state'}, '404': {description: GitHub environment not found}}}
  /v1/environments/{id}/github-reconcile:
    post: {operationId: reconcileGitHubEnvironment, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {description: Current selected repositories reconciled and scans queued}, '409': {description: GitHub App reauthorization required}, '503': {description: GitHub connector deployment is not healthy}}}
  /v1/environments/{id}/github-reauthorize:
    post: {operationId: reauthorizeGitHubEnvironment, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'201': {description: New short-lived GitHub App authorization URL for the existing environment}, '404': {description: GitHub environment not found}, '503': {description: GitHub connector deployment is not healthy}}}
  /v1/environments/{id}/enrollment-credentials:
    post: {operationId: rotateEndpointEnrollmentCredential, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'201': {description: New 15-minute single-use endpoint credential; earlier credentials are revoked}, '409': {description: Endpoint setup is no longer pending}}}
  /v1/environments/{id}/enable-continuous-monitoring:
    post: {operationId: enableContinuousMonitoring, description: 'Issues a display-once continuous-monitoring setup for an endpoint that completed Quick Scan while preserving its installation identity, target, and source.', parameters: [{$ref: '#/components/parameters/ID'}], responses: {'201': {description: Managed collector installation setup}, '409': {description: The environment is not an eligible completed Quick Scan}}}
  /v1/environments/{id}/handoffs:
    post: {operationId: createEndpointHandoff, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'201': {description: One-time-displayed 24-hour delegated setup URL}, '409': {description: Endpoint setup is no longer pending}}}
  /v1/environments/{id}/handoffs/{handoffId}:
    delete: {operationId: revokeEndpointHandoff, parameters: [{$ref: '#/components/parameters/ID'}, {name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'204': {description: Handoff revoked}, '404': {description: Active handoff not found}}}
  /v1/public/endpoint-handoffs/resolve:
    post:
      security: []
      operationId: resolveEndpointHandoff
      description: Resolves a fragment-delivered handoff token after explicit platform choice and issues a 15-minute single-use enrollment command. Responses prohibit caching and referrers.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [token, platform], properties: {token: {type: string}, platform: {enum: [macos, windows, linux]}}}}}}
      responses: {'200': {description: Platform-specific enrollment command}, '410': {description: 'Handoff expired, revoked, or completed'}, '429': {description: Handoff resolution rate limit is active}}
  /v1/environments/{id}/scans:
    post: {operationId: createEnvironmentScan, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {description: Manual scan queued or coalesced with the active scan}, '409': {description: Environment is not connected}}}
  /v1/environments/{id}/scans/{scanId}:
    get:
      operationId: getEnvironmentScan
      parameters: [{$ref: '#/components/parameters/ID'}, {name: scanId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: 'Live phase, progress, coverage, and safe error'}, '404': {description: Scan not found in the active workspace and environment}}
  /v1/entities:
    get:
      operationId: listEntities
      parameters: [{name: kind, in: query, schema: {type: string}}, {name: confidence, in: query, schema: {enum: [confirmed, likely, possible]}}, {name: state, in: query, schema: {type: string}}, {name: surface, in: query, schema: {type: string}}, {name: target_id, in: query, schema: {type: string}}, {name: freshness, in: query, description: Filter entity inventory by reporting-target freshness., schema: {enum: [fresh, stale, all], default: all}}, {name: system_role, in: query, schema: {type: string}}, {name: system_type, in: query, schema: {type: string}}, {name: network_scope, in: query, schema: {type: string}}, {name: search, in: query, schema: {type: string}}, {name: sort, in: query, schema: {enum: [last_seen, name]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Current evidence-backed entity inventory}}
  /v1/entities/{id}:
    get: {operationId: getEntity, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Entity and retained evidence}, '404': {description: Entity not found}}}
  /v1/entities/{id}/context:
    get: {operationId: getEntityContext, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: 'Operator-supplied context, separate from collector evidence'}}}
    put: {operationId: putEntityContext, description: 'Requires human administrator context:write. Collector and Registry service credentials are never granted this scope.', parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EntityContext'}}}}, responses: {'200': {description: Audited context assertion saved}, '403': {description: Human administrator access required}}}
  /v1/entities/{id}/catalog-link:
    put: {operationId: putCatalogLink, description: Selects a reviewed catalogue API/version for an ambiguous or stdio connector., parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {description: Reviewed link accepted for enrichment}}}
    delete: {operationId: deleteCatalogLink, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Reviewed catalogue link removed}}}
  /v1/relationships:
    get: {operationId: listRelationships, parameters: [{name: kind, in: query, schema: {type: string}}, {name: entity_id, in: query, schema: {type: string}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: 'Current evidence-backed relationships with confidence, contributing surfaces, observation states, and last observation time'}}}
  /v1/changes:
    get: {operationId: listChanges, parameters: [{name: category, in: query, schema: {enum: [state, network_scope, attribution, capability, confidence, identity, freshness, metadata]}}, {name: target_id, in: query, schema: {type: string}}, {name: system_type, in: query, schema: {type: string}}, {name: system_role, in: query, schema: {enum: [system, supporting, component, artifact, target]}}, {name: surface, in: query, schema: {type: string}}, {name: window, in: query, schema: {enum: [24h, 7d, 30d, 90d]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Material discovery changes with safe field-level differences}}}
  /v1/overview:
    get: {operationId: getDiscoveryOverview, parameters: [{name: window, in: query, schema: {enum: [24h, 7d, 30d, 90d], default: 7d}}], responses: {'200': {description: 'Server-computed discovery posture, coverage, factual attention, data quality, and changes'}}}
  /v1/products:
    get: {operationId: listProducts, responses: {'200': {description: 'Organization-wide products grouped over target-scoped installations, with fresh and stale evidence and non-authoritative observed users retained'}}}
  /v1/systems:
    get: {operationId: listSystems, parameters: [{name: system_type, in: query, schema: {enum: [autonomous_agent, agent_tool, model_runtime]}}, {name: product_id, in: query, schema: {type: string}}, {name: state, in: query, schema: {type: string}}, {name: surface, in: query, schema: {type: string}}, {name: target_id, in: query, schema: {type: string}}, {name: freshness, in: query, description: Includes fresh and stale target-scoped installations by default so retained identities are not hidden., schema: {enum: [fresh, stale, all], default: all}}, {name: confidence, in: query, schema: {enum: [confirmed, likely, possible]}}, {name: attribution, in: query, schema: {enum: [attributed, unattributed]}}, {name: owner_status, in: query, schema: {enum: [owned, unowned]}}, {name: network_scope, in: query, schema: {type: string}}, {name: search, in: query, schema: {type: string}}, {name: sort, in: query, schema: {enum: [last_seen, name]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: 'Root autonomous agents, agent tools, and model runtimes'}}}
  /v1/systems/{id}:
    get: {operationId: getSystem, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: 'Root system posture, connected inventory, and evidence'}, '404': {description: System not found}}}
  /v1/topology/paths:
    get: {operationId: getTopologyPaths, parameters: [{name: entity_id, in: query, required: true, schema: {type: string}}, {name: direction, in: query, required: true, schema: {enum: [downstream, upstream]}}], responses: {'200': {description: 'Up to 80 current evidence-backed paths of at most three hops, with per-edge confidence, provenance, and safe evidence references'}, '404': {description: Entity not found}}}
  /v1/systems/{id}/exposure-map:
    get: {operationId: getSystemExposureMap, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: 'Bounded observed paths, operator context, catalogue potential, and explainable findings'}}}
  /v1/exposures:
    get: {operationId: listExposures, parameters: [{name: severity, in: query, schema: {enum: [critical, high, medium, low]}}, {name: freshness, in: query, schema: {enum: [fresh, stale, all]}}, {name: owner_status, in: query, schema: {enum: [owned, unowned]}}, {name: system_type, in: query, schema: {enum: [autonomous_agent, agent_tool, model_runtime]}}, {name: surface, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: 'Workspace-wide findings ranked by severity, evidence freshness, ownership, latest observation, and stable ID'}}}
  /v1/exposures/{id}:
    get: {operationId: getExposure, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: Versioned finding with evidence bases and path}, '404': {description: Finding not found}}}
  /v1/catalog/search:
    get: {operationId: searchCapabilityCatalog, parameters: [{name: q, in: query, schema: {type: string, maxLength: 200}}], responses: {'200': {description: Catalogue suggestions that require explicit review unless uniquely identified}}}
  /v1/targets:
    get: {operationId: listTargets, parameters: [{name: target_type, in: query, schema: {enum: [endpoint, repository, kubernetes, cloud]}}, {name: search, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Unique discovery targets with nested active collectors}}}
  /v1/targets/{id}:
    get: {operationId: getTarget, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {description: 'Discovery target, freshness, scan coverage, and collectors'}, '404': {description: Target not found}}}
  /v1/coverage:
    get: {operationId: getCoverage, responses: {'200': {description: Source coverage and freshness}}}
  /v1/notifications:
    get: {operationId: listNotifications, responses: {'200': {description: Durable in-app lifecycle notifications}}}
  /v1/notifications/{id}:
    patch: {operationId: readNotification, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Notification marked read}, '404': {description: Notification not found}}}
  /v1/exports:
    get: {operationId: exportInventory, parameters: [{name: format, in: query, schema: {enum: [lens, ndjson, cyclonedx]}}], responses: {'200': {description: 'Lens JSON, JSONL, or CycloneDX 1.7 export'}}}
  /v1/admin/service-accounts:
    post: {operationId: createServiceAccount, description: 'Creates a one-time-displayed, hash-at-rest integration credential. Registry integrations are restricted to inventory:read.', responses: {'201': {description: Service account and one-time token}, '403': {description: Administrator access required}}}
  /v1/admin/service-accounts/{id}:
    delete: {operationId: revokeServiceAccount, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Service account revoked}, '404': {description: Service account not found}}}
  /v1/webhooks:
    post: {operationId: createWebhook, requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [url], properties: {url: {type: string, format: uri, pattern: '^https://'}}}}}}, responses: {'201': {description: Webhook and one-time HMAC signing secret}}}
  /v1/connectors/github/webhook:
    post: {security: [], operationId: receiveGitHubWebhook, responses: {'202': {description: Signed webhook accepted}, '401': {description: Invalid signature}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque seek-pagination cursor returned by the previous page}
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [user, workspace, role, permissions, needs_bootstrap, can_delete_account, analytics]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id]
          properties: {id: {type: string}}
        workspace:
          type: object
          additionalProperties: false
          required: [id, name]
          properties: {id: {type: string}, name: {type: string}}
        role: {enum: [owner, admin, viewer]}
        permissions: {type: array, items: {type: string}}
        needs_bootstrap: {type: boolean}
        can_delete_account: {type: boolean}
        analytics:
          type: object
          additionalProperties: false
          required: [enabled, user_id, workspace_id]
          properties:
            enabled: {type: boolean}
            user_id: {type: string, pattern: '^(phu_[a-f0-9]{64})?$'}
            workspace_id: {type: string, pattern: '^(phw_[a-f0-9]{64})?$'}
    Enrollment:
      type: object
      additionalProperties: false
      required: [code, platform, architecture, collector_version, identity_public_key, identity_proof]
      properties: {code: {type: string}, source_type: {enum: [endpoint, repository, kubernetes]}, enrollment_mode: {enum: [quick_scan, continuous], default: continuous, description: Quick Scan receives only a short-lived access token; continuous enrollment also receives a stable credential that remains valid until explicit revocation.}, hostname: {type: string}, target_identity: {type: string, description: Stable cluster UID or owner/repository identity for non-endpoint collectors}, display_name: {type: string}, platform: {type: string}, architecture: {type: string}, collector_version: {type: string}, identity_public_key: {type: string, description: Base64url-encoded Ed25519 public key}, identity_proof: {type: string, description: Ed25519 signature over the type-aware enrollment request}}
    DeploymentPolicyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string}
        source_type: {enum: [endpoint, repository, kubernetes], default: endpoint}
        discovery_depth: {enum: [basic, standard, deep], default: standard}
        configuration: {type: object, additionalProperties: true, description: Non-secret discovery options; credential-like keys are rejected.}
        expected_device_count: {type: [integer, 'null'], minimum: 0}
        credential_expires_in_seconds: {type: integer, minimum: 60, maximum: 2592000, default: 86400}
        max_enrollments: {type: integer, minimum: 1, maximum: 100000, default: 100}
    DeploymentPolicyUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string}
        discovery_depth: {enum: [basic, standard, deep]}
        configuration: {type: object, additionalProperties: true, description: Non-secret discovery options; credential-like keys are rejected.}
        expected_device_count: {type: [integer, 'null'], minimum: 0}
        credential_expires_in_seconds: {type: integer, minimum: 60, maximum: 2592000}
        max_enrollments: {type: integer, minimum: 1, maximum: 100000}
    DeploymentCredential:
      type: object
      additionalProperties: false
      required: [id, status, expires_at, max_enrollments, enrolled_count, remaining_count, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [active, expired, exhausted, revoked]}
        expires_at: {type: string, format: date-time}
        max_enrollments: {type: integer, minimum: 1}
        enrolled_count: {type: integer, minimum: 0}
        remaining_count: {type: integer, minimum: 0}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    DeploymentPolicy:
      type: object
      additionalProperties: false
      required: [id, name, source_type, discovery_depth, configuration, expected_device_count, credential_expires_in_seconds, max_enrollments, status, enrolled_count, remaining_count, created_by, updated_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        source_type: {enum: [endpoint, repository, kubernetes]}
        discovery_depth: {enum: [basic, standard, deep]}
        configuration: {type: object, additionalProperties: true}
        expected_device_count: {type: [integer, 'null'], minimum: 0}
        credential_expires_in_seconds: {type: integer, minimum: 60}
        max_enrollments: {type: integer, minimum: 1}
        status: {enum: [active, revoked]}
        enrolled_count: {type: integer, minimum: 0, description: Distinct targets enrolled by the policy.}
        remaining_count: {type: integer, minimum: 0, description: 'Uses remaining across active, unexpired policy credentials.'}
        created_by: {type: string}
        updated_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        credentials: {type: array, items: {$ref: '#/components/schemas/DeploymentCredential'}}
    DeploymentCredentialCreation:
      type: object
      additionalProperties: false
      required: [credential, code, credential_displayed_once, hub_url, collector_version]
      properties:
        credential: {$ref: '#/components/schemas/DeploymentCredential'}
        code: {type: string, description: Displayed once and never retained in plaintext.}
        credential_displayed_once: {type: boolean, const: true}
        hub_url: {type: string}
        collector_version: {type: string}
    DeviceFleetSummary:
      type: object
      additionalProperties: false
      required: [enrolled, scanned, reporting, stale_offline, partial, failed, revoked]
      properties:
        enrolled: {type: integer, minimum: 0}
        scanned: {type: integer, minimum: 0}
        reporting: {type: integer, minimum: 0}
        stale_offline: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        revoked: {type: integer, minimum: 0}
    FleetDevice:
      type: object
      additionalProperties: false
      required: [id, name, observed_name, reporting_mode, lifecycle_status, freshness, identity_quality, possible_duplicate, partial, failed, current, first_seen_at, evidence_url]
      properties:
        id: {type: string}
        name: {type: string, description: 'Administrator-defined friendly name when present, otherwise the latest observed hostname.'}
        observed_name: {type: string, description: Latest hostname observed from the collector; not used as installation identity.}
        custom_name: {type: string}
        platform: {type: string}
        architecture: {type: string}
        collector_version: {type: string}
        reporting_mode: {enum: [continuous, quick_scan]}
        lifecycle_status: {enum: [never_scanned, reporting, stale_offline, partial, failed, revoked]}
        freshness: {enum: [fresh, stale, never]}
        identity_quality: {enum: [persistent, legacy_identity]}
        possible_duplicate: {type: boolean}
        partial: {type: boolean}
        failed: {type: boolean}
        current: {type: boolean}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_full_at: {type: string, format: date-time}
        evidence_expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        deployment_policy_id: {type: string, format: uuid}
        deployment_policy_name: {type: string}
        evidence_url: {type: string}
    DeviceFleetPage:
      type: object
      additionalProperties: false
      required: [items, summary, policies, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FleetDevice'}}
        summary: {$ref: '#/components/schemas/DeviceFleetSummary'}
        policies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, status, expected_device_count, enrolled_count, remaining_count]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              status: {enum: [active, revoked]}
              expected_device_count: {type: [integer, 'null'], minimum: 0}
              enrolled_count: {type: integer, minimum: 0}
              remaining_count: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 1000}
        next_cursor: {type: string}
    EnvironmentSetupRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {enum: [aws_account, azure_subscription, gcp_project, endpoint, github_repository, kubernetes_cluster]}
        display_name: {type: string, minLength: 1, maxLength: 128}
        configuration: {type: object, description: Provider identifiers only; secret-like fields are rejected., additionalProperties: true}
    CoverageBaselineRequest:
      type: object
      additionalProperties: false
      required: [baselines]
      properties:
        baselines:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [target_type, expected_count]
            properties:
              target_type: {enum: [endpoint, repository, kubernetes, cloud]}
              expected_count: {type: [integer, 'null'], minimum: 0}
    EntityContext:
      type: object
      additionalProperties: false
      properties:
        owner_name: {type: string, maxLength: 200}
        owner_type: {enum: [person, team]}
        environment: {enum: [development, test, staging, production]}
        criticality: {enum: [low, medium, high, critical]}
        sensitivity: {enum: [public, internal, confidential, restricted]}
        data_categories: {type: array, uniqueItems: true, items: {enum: [personal, health, payment, financial, credentials, source_code, customer]}}
        trust_boundary: {enum: [internal, partner, third_party]}
