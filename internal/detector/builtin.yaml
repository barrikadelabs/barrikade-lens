schema_version: "2"
id: barrikade-lens-builtin
version: "2.0.0-dev"
runtimes:
  - id: claude
    name: Claude Code
    category: agent_tool
    processes: [claude]
    images: [claude-code, anthropic/claude]
    environment_keys: [CLAUDE_CODE_ENTRYPOINT]
    extension_ids: [anthropic.claude-code]
    install_paths: ["~/.vscode/extensions/anthropic.claude-code-*", "~/.cursor/extensions/anthropic.claude-code-*"]
    paths: ["~/.claude", "~/.config/claude"]
    configs:
      - {path: "~/.claude.json", format: json, scope: user}
      - {path: "~/.claude/settings.json", format: json, scope: user}
      - {path: "~/Library/Application Support/Claude/claude_desktop_config.json", format: json, scope: user}
      - {path: "~/.config/Claude/claude_desktop_config.json", format: json, scope: user}
      - {path: "%APPDATA%/Claude/claude_desktop_config.json", format: json, scope: user}
    skill_roots: ["~/.claude/skills"]
    agent_roots: ["~/.claude/agents"]
  - id: codex
    name: OpenAI Codex
    category: agent_tool
    processes: [codex]
    images: [openai/codex, codex-cli]
    environment_keys: [CODEX_HOME]
    install_paths: ["/Applications/ChatGPT.app/Contents/Resources/codex"]
    paths: ["~/.codex"]
    configs:
      - {path: "~/.codex/config.toml", format: toml, scope: user}
      - {path: "~/.codex/.codex-global-state.json", format: json, scope: user}
    skill_roots: ["~/.codex/skills"]
  - id: cursor
    name: Cursor
    category: agent_tool
    processes: [Cursor, cursor]
    install_paths: ["/Applications/Cursor.app"]
    paths: ["~/.cursor", "~/Library/Application Support/Cursor", "~/.config/Cursor", "%APPDATA%/Cursor/User"]
    configs:
      - {path: "~/.cursor/mcp.json", format: json, scope: user}
      - {path: "%APPDATA%/Cursor/User/mcp.json", format: json, scope: user}
  - id: copilot
    name: GitHub Copilot
    category: agent_tool
    processes: [copilot, copilot-language-server, github-copilot]
    extension_ids: [github.copilot, github.copilot-chat]
    install_paths: ["~/.vscode/extensions/github.copilot-*", "~/.cursor/extensions/github.copilot-*"]
    paths: ["~/.config/github-copilot", "~/.copilot"]
    agent_roots: ["~/.copilot/agents"]
  - id: vscode
    name: Visual Studio Code
    category: host_application
    processes: [Code, code]
    install_paths: ["/Applications/Visual Studio Code.app"]
    paths: ["~/Library/Application Support/Code/User", "~/.config/Code/User", "~/.vscode", "%APPDATA%/Code/User"]
    configs:
      - {path: "~/Library/Application Support/Code/User/mcp.json", format: json, scope: user}
      - {path: "~/.config/Code/User/mcp.json", format: json, scope: user}
      - {path: "%APPDATA%/Code/User/mcp.json", format: json, scope: user}
      - {path: "~/Library/Application Support/Code/User/settings.json", format: jsonc, scope: user}
      - {path: "~/.config/Code/User/settings.json", format: jsonc, scope: user}
      - {path: "%APPDATA%/Code/User/settings.json", format: jsonc, scope: user}
  - id: gemini
    name: Gemini CLI
    category: agent_tool
    processes: [gemini]
    paths: ["~/.gemini"]
    configs:
      - {path: "~/.gemini/settings.json", format: json, scope: user}
    skill_roots: ["~/.gemini/skills"]
  - id: antigravity
    name: Antigravity
    category: agent_tool
    processes: [antigravity, antigravity-cli, "Antigravity IDE"]
    install_paths: ["/Applications/Antigravity IDE.app", "/Applications/Antigravity.app"]
    paths: ["~/.antigravity"]
    configs:
      - {path: "~/.gemini/config/hooks.json", format: json, scope: user}
  - id: windsurf
    name: Windsurf
    category: agent_tool
    processes: [Windsurf, windsurf]
    install_paths: ["/Applications/Windsurf.app"]
    paths: ["~/.codeium/windsurf", "~/Library/Application Support/Windsurf", "~/.config/Windsurf", "%APPDATA%/Windsurf/User"]
    configs:
      - {path: "~/.codeium/windsurf/mcp_config.json", format: json, scope: user}
      - {path: "%APPDATA%/Windsurf/User/mcp_config.json", format: json, scope: user}
  - id: devin
    name: Devin
    category: agent_tool
    processes: [devin]
    paths: ["~/.devin"]
  - id: cline
    name: Cline
    category: agent_tool
    processes: [cline]
    extension_ids: [saoudrizwan.claude-dev]
    install_paths: ["~/.vscode/extensions/saoudrizwan.claude-dev-*", "~/.cursor/extensions/saoudrizwan.claude-dev-*"]
    paths: ["~/.cline"]
    configs:
      - {path: "~/.cline/mcp_settings.json", format: json, scope: user}
      - {path: "~/.cline/data/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "~/Library/Application Support/Code - Insiders/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "~/.config/Code - Insiders/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "%APPDATA%/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json", format: json, scope: user}
  - id: roo
    name: Roo Code
    category: agent_tool
    processes: [roo]
    extension_ids: [rooveterinaryinc.roo-cline]
    install_paths: ["~/.vscode/extensions/rooveterinaryinc.roo-cline-*", "~/.cursor/extensions/rooveterinaryinc.roo-cline-*"]
    paths: ["~/.roo"]
    configs:
      - {path: "~/.roo/mcp.json", format: json, scope: user}
      - {path: "~/Library/Application Support/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "~/.config/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/cline_mcp_settings.json", format: json, scope: user}
      - {path: "%APPDATA%/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/cline_mcp_settings.json", format: json, scope: user}
  - id: kiro
    name: Kiro
    category: agent_tool
    processes: [kiro]
    paths: ["~/.kiro"]
    configs:
      - {path: "~/.kiro/settings/mcp.json", format: json, scope: user}
    skill_roots: ["~/.kiro/skills"]
  - id: amazon-q
    name: Amazon Q Developer
    category: agent_tool
    processes: [q, amazon-q]
    paths: ["~/.aws/amazonq", "~/.config/amazon-q"]
  - id: continue
    name: Continue
    category: agent_tool
    processes: [continue]
    extension_ids: [continue.continue]
    install_paths: ["~/.vscode/extensions/continue.continue-*", "~/.cursor/extensions/continue.continue-*"]
    paths: ["~/.continue"]
    configs:
      - {path: "~/.continue/config.yaml", format: yaml, scope: user}
  - id: opencode
    name: OpenCode
    category: agent_tool
    processes: [opencode]
    paths: ["~/.config/opencode", "~/.opencode"]
    configs:
      - {path: "~/.config/opencode/opencode.json", format: json, scope: user}
  - id: openclaw
    name: OpenClaw
    category: agent_tool
    processes: [openclaw, openclaw-gateway]
    paths: ["~/.openclaw"]
    configs:
      - {path: "~/.openclaw/openclaw.json", format: json, scope: user}
  - id: aider
    name: Aider
    category: agent_tool
    processes: [aider]
    paths: ["~/.aider"]
    configs:
      - {path: "~/.aider.conf.yml", format: yaml, scope: user}
  - id: goose
    name: Goose
    category: agent_tool
    processes: [goose]
    images: [block/goose, goose-ai]
    paths: ["~/.config/goose"]
    configs:
      - {path: "~/.config/goose/config.yaml", format: yaml, scope: user}
  - id: factory
    name: Factory
    category: agent_tool
    processes: [droid, factory]
    paths: ["~/.factory"]
  - id: grok
    name: Grok CLI
    category: agent_tool
    processes: [grok]
    paths: ["~/.grok"]
  - id: hermes
    name: Hermes Agent
    category: agent_tool
    processes: [hermes]
    paths: ["~/.hermes"]
  - id: zed
    name: Zed
    category: agent_tool
    processes: [zed, Zed]
    install_paths: ["/Applications/Zed.app"]
    paths: ["~/.config/zed", "~/Library/Application Support/Zed", "%APPDATA%/Zed"]
    configs:
      - {path: "~/.config/zed/settings.json", format: json, scope: user}
  - id: warp
    name: Warp
    category: agent_tool
    processes: [Warp, warp]
    install_paths: ["/Applications/Warp.app"]
    paths: ["~/.warp", "~/Library/Application Support/dev.warp.Warp-Stable"]
  - id: junie
    name: JetBrains Junie
    category: agent_tool
    processes: [junie]
    paths: ["~/.junie"]
  - id: augment
    name: Augment Code
    category: agent_tool
    processes: [augment]
    paths: ["~/.augment"]
  - id: qodo
    name: Qodo
    category: agent_tool
    processes: [qodo]
    paths: ["~/.qodo"]
  - id: ollama
    name: Ollama
    category: model_runtime
    processes: [ollama]
    images: [ollama/ollama]
    environment_keys: [OLLAMA_HOST, OLLAMA_MODELS]
    install_paths: ["/Applications/Ollama.app"]
    paths: ["~/.ollama"]
    model_servers: [{name: Ollama, port: 11434}]
  - id: lm-studio
    name: LM Studio
    category: model_runtime
    processes: [LM Studio, lms]
    images: [lmstudio, lm-studio]
    environment_keys: [LM_STUDIO_HOME]
    install_paths: ["/Applications/LM Studio.app"]
    paths: ["~/.lmstudio", "~/.cache/lm-studio", "~/Library/Application Support/LM Studio", "%APPDATA%/LM Studio"]
    model_servers: [{name: LM Studio, port: 1234}]
  - id: jan
    name: Jan
    category: model_runtime
    processes: [jan, Jan]
    install_paths: ["/Applications/Jan.app"]
    paths: ["~/.jan", "~/Library/Application Support/Jan", "%APPDATA%/Jan"]
    model_servers: [{name: Jan, port: 1337}]
  - id: llama-cpp
    name: llama.cpp
    category: model_runtime
    processes: [llama-server, llama-cli, llama]
    images: [llama.cpp, llama-cpp]
  - id: vllm
    name: vLLM
    category: model_runtime
    processes: [vllm]
    images: [vllm/vllm-openai, vllm]
    model_servers: [{name: vLLM OpenAI-compatible API, port: 8000}]
  - id: localai
    name: LocalAI
    category: model_runtime
    processes: [local-ai, localai]
    images: [localai/localai]
    paths: ["~/.localai"]
    model_servers: [{name: LocalAI API, port: 8080}]
  - id: anythingllm
    name: AnythingLLM
    category: agent_tool
    processes: [anythingllm, AnythingLLM]
    install_paths: ["/Applications/AnythingLLM.app"]
    paths: ["~/.anythingllm", "~/Library/Application Support/anythingllm-desktop", "%APPDATA%/anythingllm-desktop"]
  - id: trae
    name: Trae
    category: agent_tool
    processes: [trae, Trae]
    install_paths: ["/Applications/Trae.app"]
    paths: ["~/.trae", "~/Library/Application Support/Trae", "%APPDATA%/Trae"]
  - id: nodejs
    name: Node.js
    category: development_runtime
    processes: [node]
  - id: python
    name: Python
    category: development_runtime
    processes: [python, python3]
  - id: bun
    name: Bun
    category: development_runtime
    processes: [bun]
  - id: uv
    name: uv
    category: development_runtime
    processes: [uv]
frameworks:
  - id: langchain
    name: LangChain
    language_packages:
      python: [langchain]
      javascript: [langchain, "@langchain/core"]
    language_imports:
      python: [langchain]
      javascript: [langchain, "@langchain/core"]
  - id: langgraph
    name: LangGraph
    language_packages:
      python: [langgraph]
      javascript: ["@langchain/langgraph"]
    language_imports:
      python: [langgraph]
      javascript: ["@langchain/langgraph"]
  - id: llamaindex
    name: LlamaIndex
    language_packages:
      python: [llama-index, llama_index]
    language_imports:
      python: [llama_index]
  - id: crewai
    name: CrewAI
    language_packages:
      python: [crewai]
    language_imports:
      python: [crewai]
  - id: autogen
    name: AutoGen
    language_packages:
      python: [autogen-agentchat, pyautogen]
    language_imports:
      python: [autogen]
  - id: agents-sdk
    name: OpenAI Agents SDK
    language_packages:
      python: [openai-agents]
      javascript: ["@openai/agents"]
    language_imports:
      python: [agents]
      javascript: ["@openai/agents"]
  - id: google-adk
    name: Google Agent Development Kit
    language_packages:
      python: [google-adk]
    language_imports:
      python: [google.adk]
  - id: semantic-kernel
    name: Semantic Kernel
    language_packages:
      python: [semantic-kernel]
      dotnet: [Microsoft.SemanticKernel]
    language_imports:
      python: [semantic_kernel]
      dotnet: [Microsoft.SemanticKernel]
  - id: mastra
    name: Mastra
    language_packages:
      javascript: ["@mastra/core"]
    language_imports:
      javascript: ["@mastra/core"]
  - id: pydantic-ai
    name: PydanticAI
    language_packages:
      python: [pydantic-ai]
    language_imports:
      python: [pydantic_ai]
  - id: smolagents
    name: smolagents
    language_packages:
      python: [smolagents]
    language_imports:
      python: [smolagents]
  - id: haystack
    name: Haystack
    language_packages:
      python: [haystack-ai]
    language_imports:
      python: [haystack]
  - id: vercel-ai
    name: Vercel AI SDK
    language_packages:
      javascript: [ai, "@ai-sdk/openai"]
    language_imports:
      javascript: [ai, "@ai-sdk/openai"]
  - id: voltagent
    name: VoltAgent
    language_packages:
      javascript: [voltagent, "@voltagent/core"]
    language_imports:
      javascript: [voltagent, "@voltagent/core"]
  - id: claude-agent-sdk
    name: Claude Agent SDK
    language_packages:
      python: [claude-agent-sdk]
      javascript: ["@anthropic-ai/claude-agent-sdk"]
    language_imports:
      python: [claude_agent_sdk]
      javascript: ["@anthropic-ai/claude-agent-sdk"]
skill_roots:
  - id: portable-agent-skills
    name: Portable Agent Skills
    scope: user
    paths: ["~/.agents/skills", "~/.config/agent-skills", "%USERPROFILE%/.agents/skills"]
extension_roots:
  - "~/.vscode/extensions"
  - "~/.cursor/extensions"
  - "~/.windsurf/extensions"
  - "%USERPROFILE%/.vscode/extensions"
model_caches:
  - id: huggingface-cache
    name: Hugging Face Hub Cache
    layout: huggingface
    paths: ["~/.cache/huggingface/hub"]
  - id: ollama-cache
    name: Ollama Model Cache
    layout: ollama
    paths: ["~/.ollama/models/manifests"]
  - id: lm-studio-cache
    name: LM Studio Model Cache
    layout: lm-studio
    paths: ["~/.cache/lm-studio/models", "~/.lmstudio/models", "%USERPROFILE%/.cache/lm-studio/models"]
  - id: torch-cache
    name: Torch Model Cache
    layout: directory
    paths: ["~/.cache/torch"]
listeners:
  - {id: localai-8080, name: LocalAI or llama.cpp, kind: model_server, port: 8080, processes: [local-ai, localai, llama-server]}
  - {id: inference-8000, name: LocalAI, vLLM, or LiteLLM, kind: model_server, port: 8000, processes: [local-ai, localai, vllm, litellm]}
  - {id: textgen-7860, name: Text Generation WebUI, kind: model_server, port: 7860, processes: [text-generation-webui, text-generation-launcher]}
  - {id: textgen-5000, name: Text Generation WebUI API, kind: model_server, port: 5000, processes: [text-generation-webui, text-generation-launcher]}
  - {id: figma-mcp-3845, name: Figma Desktop MCP, kind: mcp_server, port: 3845, processes: [Figma, figma]}
  - {id: jetbrains-mcp-63334, name: JetBrains MCP, kind: mcp_server, port: 63334, processes: [idea, goland, webstorm, pycharm]}
  - {id: jetbrains-mcp-64342, name: JetBrains MCP, kind: mcp_server, port: 64342, processes: [idea, goland, webstorm, pycharm]}
