apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-lens-k8s}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: lens-k8s, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: lens-k8s, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      serviceAccountName: {{ .Release.Name }}-lens-k8s
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.existingSecret }}
          args: ["--config", "/var/lib/lens/config.json", "--bootstrap-config", "/var/run/lens-bootstrap/config.json", "--cluster-id", {{ .Values.clusterID | quote }}, "--cluster-name", {{ .Values.clusterName | quote }}]
          {{- else }}
          args: ["--config", "/var/lib/lens/config.json", "--cluster-id", {{ .Values.clusterID | quote }}, "--cluster-name", {{ .Values.clusterName | quote }}]
          {{- end }}
          {{- if or .Values.enrollmentCode .Values.hubURL }}
          envFrom:
            - secretRef: {name: {{ .Release.Name }}-lens-k8s-enrollment}
          {{- end }}
          volumeMounts:
            {{- if .Values.existingSecret }}
            - {name: collector-bootstrap, mountPath: /var/run/lens-bootstrap, readOnly: true}
            {{- end }}
            - {name: collector-state, mountPath: /var/lib/lens}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      volumes:
        {{- if .Values.existingSecret }}
        - {name: collector-bootstrap, secret: {secretName: {{ .Values.existingSecret }}, defaultMode: 0440}}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - {name: collector-state, persistentVolumeClaim: {claimName: {{ .Release.Name }}-lens-k8s-state}}
        {{- else }}
        - {name: collector-state, emptyDir: {}}
        {{- end }}
