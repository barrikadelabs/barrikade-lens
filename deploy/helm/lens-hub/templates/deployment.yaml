apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-hub}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: lens-hub, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: lens-hub, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: LENS_PUBLIC_URL, value: {{ .Values.publicURL | quote }}}
            - {name: LENS_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}}}
            - {name: LENS_WEB_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: web-database-url, optional: true}}}
            - {name: LENS_WORKER_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: worker-database-url, optional: true}}}
            - {name: LENS_JWT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: jwt-secret}}}
            - {name: LENS_AUTH_MODE, value: {{ .Values.auth.mode | quote }} }
            - {name: LENS_CLERK_ISSUER, value: {{ .Values.auth.clerk.issuer | quote }} }
            - {name: LENS_CLERK_PUBLISHABLE_KEY, value: {{ .Values.auth.clerk.publishableKey | quote }} }
            - {name: LENS_CLERK_AUTHORIZED_PARTY, value: {{ .Values.auth.clerk.authorizedParty | quote }} }
            - {name: LENS_CLERK_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: clerk-webhook-secret, optional: true}}}
            - {name: LENS_CLERK_SECRET_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: clerk-secret-key, optional: true}}}
            - {name: LENS_SELF_SERVE_ENABLED, value: {{ .Values.selfServe.enabled | quote }} }
            - {name: LENS_AWS_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.aws | quote }} }
            - {name: LENS_AZURE_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.azure | quote }} }
            - {name: LENS_GCP_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.gcp | quote }} }
            - {name: LENS_ENDPOINT_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.endpoint | quote }} }
            - {name: LENS_KUBERNETES_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.kubernetes | quote }} }
            - {name: LENS_GITHUB_CONNECTOR_ENABLED, value: {{ .Values.selfServe.connectors.github | quote }} }
            - {name: LENS_ENDPOINT_HANDOFF_ENABLED, value: {{ .Values.selfServe.endpointHandoff | quote }} }
            - {name: LENS_AWS_BROKER_ROLE_ARN, value: {{ .Values.selfServe.aws.brokerRoleARN | quote }} }
            - {name: LENS_AWS_FEDERATION_AUDIENCE, value: {{ .Values.selfServe.aws.federationAudience | quote }} }
            - {name: LENS_AWS_REGIONS, value: {{ .Values.selfServe.aws.regions | quote }} }
            - {name: LENS_AZURE_APPLICATION_ID, value: {{ .Values.selfServe.azure.applicationID | quote }} }
            - {name: LENS_AZURE_ASSERTION_AUDIENCE, value: {{ .Values.selfServe.azure.assertionAudience | quote }} }
            - {name: LENS_GCP_WORKLOAD_ISSUER, value: {{ .Values.selfServe.gcp.workloadIssuer | quote }} }
            - {name: LENS_GCP_WORKLOAD_AUDIENCE, value: {{ .Values.selfServe.gcp.workloadAudience | quote }} }
            - {name: LENS_GCP_ASSERTION_AUDIENCE, value: {{ .Values.selfServe.gcp.assertionAudience | quote }} }
            - {name: LENS_AZURE_MANAGED_IDENTITY_CLIENT_ID, value: {{ .Values.selfServe.managedIdentity.clientID | quote }} }
            - {name: LENS_AZURE_MANAGED_IDENTITY_PRINCIPAL_ID, value: {{ .Values.selfServe.managedIdentity.principalID | quote }} }
            - {name: LENS_GITHUB_APP_SLUG, value: {{ .Values.github.appSlug | quote }} }
            - {name: LENS_GITHUB_APP_ID, value: {{ .Values.github.appID | quote }} }
            {{ if .Values.github.privateKeySecret }}
            - {name: LENS_GITHUB_PRIVATE_KEY_FILE, value: /var/run/secrets/lens-github/private-key.pem}
            {{ end }}
            - {name: LENS_GITHUB_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: github-webhook-secret, optional: true}}}
            - {name: LENS_CATALOG_ENABLED, value: {{ .Values.catalog.enabled | quote }}}
            - {name: LENS_CATALOG_MANIFEST, value: {{ .Values.catalog.manifest | quote }}}
            - {name: LENS_EXPOSURE_ENABLED, value: {{ .Values.exposure.enabled | quote }}}
            - {name: LENS_POSTHOG_ENABLED, value: {{ .Values.analytics.enabled | quote }}}
            - {name: LENS_POSTHOG_HOST, value: {{ .Values.analytics.host | quote }}}
            - {name: LENS_DEPLOYMENT_ENVIRONMENT, value: {{ .Values.analytics.deploymentEnvironment | quote }}}
            - {name: LENS_POSTHOG_PROJECT_TOKEN, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: posthog-project-token, optional: true}}}
            - {name: LENS_POSTHOG_ID_SALT, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: posthog-id-salt, optional: true}}}
            - {name: LENS_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: LENS_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientID | quote }}}
            - {name: LENS_OIDC_REDIRECT_URI, value: {{ .Values.oidc.redirectURI | quote }}}
            - {name: LENS_OIDC_ADMIN_GROUP, value: {{ .Values.oidc.adminGroup | quote }}}
            - {name: LENS_OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: oidc-client-secret, optional: true}}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 10}
          {{ if .Values.github.privateKeySecret }}
          volumeMounts:
            - {name: github-private-key, mountPath: /var/run/secrets/lens-github, readOnly: true}
          {{ end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      {{ if .Values.github.privateKeySecret }}
      volumes:
        - name: github-private-key
          secret:
            secretName: {{ .Values.github.privateKeySecret | quote }}
            items:
              - {key: {{ .Values.github.privateKeyKey | quote }}, path: private-key.pem}
      {{ end }}
