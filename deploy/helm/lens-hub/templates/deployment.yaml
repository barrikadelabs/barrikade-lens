apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-hub}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: lens-hub, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: lens-hub, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: LENS_PUBLIC_URL, value: {{ .Values.publicURL | quote }}}
            - {name: LENS_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}}}
            - {name: LENS_JWT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: jwt-secret}}}
            - {name: LENS_CATALOG_ENABLED, value: {{ .Values.catalog.enabled | quote }}}
            - {name: LENS_CATALOG_MANIFEST, value: {{ .Values.catalog.manifest | quote }}}
            - {name: LENS_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: LENS_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientID | quote }}}
            - {name: LENS_OIDC_REDIRECT_URI, value: {{ .Values.oidc.redirectURI | quote }}}
            - {name: LENS_OIDC_ADMIN_GROUP, value: {{ .Values.oidc.adminGroup | quote }}}
            - {name: LENS_OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: oidc-client-secret, optional: true}}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
