# Managed Lens SaaS overlay. Apply after values.yaml.
# Supply secrets through the Secret named by existingSecret; do not put them here.
publicURL: https://lens.example.com

auth:
  mode: clerk
  clerk:
    issuer: https://your-instance.clerk.accounts.dev
    publishableKey: pk_live_replace_me
    authorizedParty: https://lens.example.com

selfServe:
  enabled: true
  endpointHandoff: true
  connectors:
    aws: false
    azure: false
    gcp: false
    endpoint: true
    kubernetes: false
    github: false

exposure:
  enabled: true

# Ship the managed build with capture disabled. Staging enablement is a
# separate, deliberate operation after PostHog project review.
analytics:
  enabled: false
  host: https://eu.i.posthog.com
  deploymentEnvironment: staging

oidc:
  issuer: ""
  clientID: ""
  redirectURI: ""
  adminGroup: ""
