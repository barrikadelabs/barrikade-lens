replicaCount: 2
image:
  repository: ghcr.io/barrikadelabs/barrikade-lens-hub
  tag: "2.0.0"
  pullPolicy: IfNotPresent
existingSecret: lens-hub
publicURL: https://lens.example.com
auth:
  mode: oidc
  clerk:
    issuer: ""
    publishableKey: ""
    authorizedParty: ""
github:
  appSlug: ""
  appID: ""
  privateKeySecret: ""
  privateKeyKey: private-key.pem
selfServe:
  enabled: false
  connectors:
    aws: false
    azure: false
    gcp: false
    endpoint: false
    kubernetes: false
    github: false
  endpointHandoff: false
  aws:
    brokerRoleARN: ""
    federationAudience: ""
    regions: ""
  azure:
    applicationID: ""
    assertionAudience: api://AzureADTokenExchange
  gcp:
    workloadIssuer: ""
    workloadAudience: ""
    assertionAudience: ""
  managedIdentity:
    clientID: ""
    principalID: ""
catalog:
  enabled: true
  manifest: https://raw.githubusercontent.com/jentic/jentic-public-apis/refs/heads/main/apis/openapi/apis.json
exposure:
  enabled: false
oidc:
  issuer: ""
  clientID: ""
  redirectURI: ""
  adminGroup: ""
service:
  type: ClusterIP
  port: 80
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
